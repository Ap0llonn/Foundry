---
# Configuration globale de l'infrastructure.
vm_ip: 149.56.96.110

# Project/environment identity drives deterministic workload isolation. Docker
# network names resolve to foundry-<project>-<environment> unless explicitly
# overridden on an environment.
project:
  name: my-project

environments:
  - name: dev
  - name: production
    # network:
    #   name: custom-production-network

networking:
  # report: preserve and report stale owned networks
  # fail: reject any stale owned network before mutation
  # remove_unused: remove stale owned networks only when no container is attached
  stale_network_policy: report
  # One-time bridge -> overlay migration is allowed only for empty Foundry-owned
  # networks. Attached networks always fail and require an explicit workload migration.
  overlay_migration_approved: false

# Optional DNS naming policy. Leave base empty for domainless operation.
# hyphen: dev-api.example.com (works with a normal *.example.com wildcard)
# nested: dev.api.example.com (requires deeper DNS/certificate coverage)
domains:
  base: "samuelcourchesne.com"
  environment_style: hyphen
  dokploy_label: dokploy
  service_names:
    - api
  # Optional Cloudflare DNS and edge-security automation. It stays disabled
  # until a real base domain and an API token are supplied.
  cloudflare:
    enabled: true
    zone: "samuelcourchesne.com"
    # Prefer an Ansible Vault value or pass cloudflare_api_token as an
    # encrypted/secure extra variable; it is never copied to the VM.
    api_token: "cfat_Y5oyYAi7RPZHzCJvCj4LFU6j4bOkpdI9tEttFYs05343ff4e"
    # Proxied DNS is required when the security profile is enabled.
    proxied: true
    wildcard: true
    apex_record: false
    # TTL 1 is Cloudflare's automatic TTL and is required for proxied records.
    ttl: 1
    security:
      enabled: true
      ssl_mode: strict
      always_use_https: true
      min_tls_version: "1.2"
      tls_1_3: true
      managed_waf: true
      rate_limit:
        enabled: true
        requests_per_period: 20
        period: 10
        mitigation_timeout: 10
        action: block

# Runtime owns Docker installation and host-level daemon policy. This executes
# after Security and before Networking. Temporarily set the migration approval
# to true only when replacing the docker.io package installed by an earlier
# Foundry iteration; return it to false after that one-time migration succeeds.
runtime:
  docker:
    enabled: true
    legacy_package_migration_approved: false
    logging:
      driver: json-file
      max_size: 10m
      max_files: 3

# OS lifecycle. Bootstrap is safe for normal runs; maintenance and reboot need
# their own explicit approvals.
os:
  operation_mode: bootstrap
  # Attach and format the VM-provider data disk first, then declare its stable
  # UUID here before enabling services.object_storage. Foundry mounts it but
  # deliberately never formats an unspecified block device.
  # mounts:
  #   - path: /srv/foundry/minio
  #     src: /dev/disk/by-uuid/REPLACE-WITH-DISK-UUID
  #     fstype: ext4
  #     opts: defaults,noatime
  #     state: mounted
  #     min_free_percent: 10
  maintenance:
    approved: false
    window: ""
    autoremove: false
    # Autoremove/purge is a separate destructive approval.
    removals_approved: false
    autoclean: false
  reboot:
    enabled: false
    approved: false
    only_if_required: true
    precheck_commands: []
    postcheck_commands: []

identity:
  # Optional Foundry role customization. Built-ins are developer, operator,
  # and viewer. Custom Linux groups always use the foundry-* namespace.
  groups: []
  # groups:
  #   - name: team1
  #     replaces: developers
  #   - name: devteam
  #     replaces: operators
  #   - name: database-team

  # Every admin using sudo.mode: inherit resolves to this explicit policy.
  # SSH authentication remains controlled independently under security.ssh.
  default_admin_sudo:
    mode: passwordless

  users:
    - name: sam
      state: present
      admin: true
      groups:
        - developer
      ssh_keys:
        - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK7L42eQxouanToSk3tTqGdf82hRiMNmiulVqUHo4QG8 samuelcourchesne@Mac"
      sudo:
        mode: inherit

    # Password-authenticated sudo example. Keep the hash in an encrypted Vault
    # vars file or retrieve it from an external secret source.
    # - name: bob
    #   state: present
    #   admin: true
    #   groups: []
    #   ssh_keys:
    #     - "ssh-ed25519 AAAA... bob@example"
    #   sudo:
    #     mode: password
    #     password_hash: "{{ vault_bob_password_hash }}"

    # Constrained admins must select authentication and explicit absolute commands.
    # - name: operator
    #   state: present
    #   admin: true
    #   groups:
    #     - operator
    #   ssh_keys:
    #     - "ssh-ed25519 AAAA... operator@example"
    #   sudo:
    #     mode: constrained
    #     authentication: passwordless
    #     commands:
    #       - /usr/bin/systemctl restart foundry.service

network:
  # Global desired exposure manifest. Workload roles contribute requirements
  # before the Security phase and must never edit UFW directly.
  exposure:
    - name: ssh
      port: 22
      protocol: tcp
      scope: management

management:
  # Dokploy requires this to be true and at least one CIDR before it can start;
  # this prevents an unauthorised visitor from claiming the first admin account.
  restrict_by_cidr: true
  allowed_cidrs:
    # Current public IP of the administrator workstation. Update this /32 when
    # changing Internet connection, or replace it with the trusted VPN CIDR.
    - 173.177.149.212/32

# Private PostgreSQL developer access. Only one mode may be active at a time:
# - tunnel: SSH forwarding through a localhost-only database proxy;
# - tailscale: a Tailscale-only database proxy on the VM.
database_access:
  enabled: true
  mode: tailscale
  environment: dev
  tunnel:
    # These sources are added to the SSH management allow-list because the
    # tunnel is established through SSH. A public key is still required.
    allowed_cidrs:
      - 173.177.149.212/32
    local_port: 15432
  tailscale:
    # Supply this through Vault or a secure extra variable when mode=tailscale.
    auth_key: "tskey-auth-kEYf6yzSp221CNTRL-Dy9YXFu1xaTAWxiLAgymaTC9wZCqwZ2m1"
    hostname: "foundry-db"
    port: 5432
    cidr: 100.64.0.0/10

# Host and application telemetry. The collector stays backend-neutral and sends
# OTLP to backend.endpoint. SigNoz is the initial supported dashboard.
observability:
  enabled: true
  dashboard: signoz
  backend:
    # The self-hosted SigNoz collector listens only on this VM. For multiple
    # application VMs, replace it with the dashboard VM's private OTLP address.
    endpoint: "127.0.0.1:14317"
    headers: {}
    tls_insecure: true
  signoz:
    enabled: true
    # The inventory host that runs the dashboard and its persistent data.
    host: app-vm
    # SigNoz is shared by every application environment, so it gets its own
    # Dokploy project. It uses that project's standard production environment.
    project: monitoring
    # Empty becomes signoz.samuelcourchesne.com.
    hostname: ""

security:
  ssh:
    enabled: true
    # Desired management port only. Foundry discovers and migrates from the
    # current port automatically; a new VM starts from the standard port 22.
    port: 22
    root_login: false
    password_authentication: false
    public_key_authentication: true
    empty_passwords: false
    forwarding:
      agent: false
      tcp: false
      x11: false
    max_auth_tries: 4
    login_grace_time: 60
    max_sessions: 10
    max_startups: "10:30:60"
    allow_groups: []
    accept_host_key_change: false

  firewall:
    enabled: true
    default_incoming: deny
    default_outgoing: allow
    ipv6: true
    unexpected_listener_policy: fail

  fail2ban:
    enabled: true
    ssh:
      enabled: true
      maxretry: 5
      findtime: 10m
      bantime: 1h
    backend: systemd
    banaction: ufw
    ignore: []

  updates:
    automatic_security_updates: true
    automatic_reboot: false
    validate_dry_run: false

  apparmor:
    enabled: true

  logging:
    persistent_journal: true

# High-level application infrastructure. Empty environment lists mean every
# declared environment. PostgreSQL and Redis use tested digest-pinned defaults.
# Omitted credentials are generated once on the VM; Vault values may be used
# for externally controlled credentials without enabling SSH password login.
services:
  postgres:
    enabled: true
    environments:
      - dev
      - production
    major: 17
    credentials:
      dev:
        password: "DevPassword123456789"
      production:
        password: "K8vP2mN7xQ4rT9zL6aBcW3"
    backup:
      enabled: true
      # Standard cron: every day at 03:00. Change this frequency as needed.
      schedule: "0 0 * * 0" # Every sunday at 00:00
      keep_latest: 3
    resources:
      memory: ""
      cpus: ""
  redis:
    enabled: true
    environments:
      - dev
      - production
    credentials: {}
    persistence: true
    maxmemory: ""
    maxmemory_policy: allkeys-lru
    resources:
      memory: ""
      cpus: ""
  # One MinIO Compose service per environment. Foundry creates separate
  # versioned assets-public, assets-private, and db-backups buckets.
  object_storage:
    enabled: true
    provider: minio
    environments:
      - dev
      - production
    data_root: /srv/foundry/minio
    # This VM has no second volume. Store MinIO under the root filesystem and
    # monitor free capacity before relying on it for backups.
    allow_root_filesystem: true
    # Empty uses minio.<domains.base>; set a full hostname inside domains.base
    # to use a different name, for example storage.example.com.
    domain_name: ""
    region: us-east-1
    console:
      enabled: true
      # Accessible only through the tailnet, never through the public domain.
      tailscale_port: 9001
    credentials:
      root_user: foundryminio
      # Leave empty for a stable generated value, or supply a Vault value.
      root_password: ""

# Dokploy requires a narrowly owned single-manager Swarm. Enabling Dokploy
# automatically enables that dependency and the one Dokploy-compatible Traefik.
# Foundry never executes Dokploy's destructive installation script.
platform:
  swarm:
    enabled: true
    advertise_address: ""
    default_address_pool: 10.240.0.0/16
    subnet_size: 24

  traefik:
    enabled: true
    http_port: 80
    https_port: 443
    tls:
      enabled: true
      mode: cloudflare_origin
      email: samuelcourchesne2004@gmail.com

  dokploy:
    enabled: true
    management_port: 3000
    credentials: {}
    secret_version: v1
    bootstrap:
      email: samuelcourchesne2004@gmail.com
      password: "12345678"
      name: Samuel
      last_name: Courchesne

# Legacy compatibility for the earlier MinIO-only interface. Do not enable it
# together with services.object_storage.
infrastructure_services:
  minio:
    enabled: false
    run_as_uid: 1000
    run_as_gid: 1000
    instances: []
