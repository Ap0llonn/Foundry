---
- name: Build required security package list
  ansible.builtin.set_fact:
    security_required_packages: >-
      {{
        ['openssh-server', 'ufw', 'iproute2']
        + (['fail2ban'] if security_resolved.fail2ban.enabled else [])
        + (['unattended-upgrades'] if security_resolved.updates.automatic_security_updates else [])
        + (['apparmor', 'apparmor-utils'] if security_resolved.apparmor.enabled else [])
      }}

- name: Install required security packages
  ansible.builtin.apt:
    name: "{{ security_required_packages | unique | sort }}"
    state: present
    update_cache: false

- name: Gather installed package facts
  ansible.builtin.package_facts:
    manager: auto
