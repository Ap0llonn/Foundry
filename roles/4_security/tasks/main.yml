---
# Couche 4 - Security. This file only orchestrates bounded security modules.
- name: 4.1 Validate and resolve the security contract
  ansible.builtin.import_tasks: 01_validate.yml
  tags:
    - always
    - security_validation

- name: 4.2 Install security platform packages
  ansible.builtin.import_tasks: 02_packages.yml
  become: true
  tags: [security, security_packages]

- name: 4.2.5 Disable unnecessary LLMNR exposure
  ansible.builtin.import_tasks: llmnr.yml
  become: true
  tags: [security, security_network_hardening]

- name: 4.3 Converge Foundry-owned firewall exposure
  ansible.builtin.import_tasks: firewall/main.yml
  become: true
  tags: [security, security_firewall, security_ssh]

- name: 4.4 Apply transactional SSH security
  ansible.builtin.import_tasks: ssh/main.yml
  become: true
  tags: [security, security_ssh]

- name: 4.5 Configure SSH abuse protection
  ansible.builtin.import_tasks: fail2ban/main.yml
  become: true
  tags: [security, security_fail2ban]

- name: 4.6 Configure automatic security updates
  ansible.builtin.import_tasks: updates/main.yml
  become: true
  tags: [security, security_updates]

- name: 4.7 Ensure AppArmor platform capability
  ansible.builtin.import_tasks: apparmor/main.yml
  become: true
  tags: [security, security_apparmor]

- name: 4.8 Configure persistent system logging
  ansible.builtin.import_tasks: logging/main.yml
  become: true
  tags: [security, security_logging]

- name: Apply pending security service handlers
  ansible.builtin.meta: flush_handlers
  tags: [security, security_fail2ban, security_logging]

- name: 4.9 Validate resulting host security state
  ansible.builtin.import_tasks: validation/main.yml
  become: true
  tags: [security, security_result]
