---
- name: Resolve declared firewall state for standalone validation
  ansible.builtin.import_tasks: ../firewall/resolve.yml

- name: Read verbose numbered UFW state
  ansible.builtin.command:
    argv: [ufw, status, numbered]
  environment:
    LC_ALL: C
  register: security_ufw_numbered_status
  changed_when: false
  check_mode: false

- name: Read verbose UFW policy state
  ansible.builtin.command:
    argv: [ufw, status, verbose]
  environment:
    LC_ALL: C
  register: security_ufw_status
  changed_when: false
  check_mode: false

- name: Validate default-deny firewall policy
  ansible.builtin.assert:
    that:
      - security_ufw_status.stdout is search('(?m)^Status:\s+active$')
      - security_ufw_status.stdout is search('(?m)^Default:\s+deny \(incoming\), ' + security_resolved.firewall.default_outgoing + ' \(outgoing\)')
    fail_msg: UFW is not active with the declared default-deny policy.
  when: security_resolved.firewall.enabled

- name: Validate exact Foundry ownership comments are active
  ansible.builtin.assert:
    that:
      - item.comment in security_ufw_numbered_status.stdout
      - (item.port | string) + '/' + item.protocol in security_ufw_numbered_status.stdout
      - >-
        item.source == 'any'
        or item.source in security_ufw_numbered_status.stdout
        or (
          item.source is match('.*/(32|128)$')
          and (item.source | ansible.utils.ipaddr('address'))
              in security_ufw_numbered_status.stdout
        )
      - >-
        not security_resolved.firewall.ipv6
        or item.source != 'any'
        or security_ufw_numbered_status.stdout is search(
             (item.port | string) + '/' + item.protocol + ' \(v6\)'
           )
    fail_msg: "Missing effective Foundry firewall rule {{ item.comment }}."
  loop: "{{ security_firewall_rules }}"
  loop_control:
    label: "{{ item.comment }}"
  when:
    - security_resolved.firewall.enabled
    - not ansible_check_mode or security_active_management_port | int == security_resolved.ssh.port | int

- name: Read configured UFW IPv6 mode
  ansible.builtin.command:
    argv: [awk, -F=, '/^IPV6=/{print $2}', /etc/default/ufw]
  register: security_ufw_ipv6_mode
  changed_when: false
  check_mode: false
  when: security_resolved.firewall.enabled

- name: Validate UFW IPv4 and IPv6 parity policy
  ansible.builtin.assert:
    that:
      - security_ufw_ipv6_mode.stdout == (security_resolved.firewall.ipv6 | ternary('yes', 'no'))
    fail_msg: UFW IPv6 mode does not match the declared parity policy.
  when: security_resolved.firewall.enabled

- name: Read wildcard network listeners
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail && ss -H -lntup |
      awk '$5 ~ /^(\*|0\.0\.0\.0|\[::\]):/ {
        address=$5; sub(/^.*:/, "", address); protocol=$1;
        sub(/[0-9]+$/, "", protocol); print protocol "|" address
      }' | sort -u
    executable: /bin/bash
  register: security_public_listeners
  changed_when: false
  check_mode: false

- name: Inspect the legacy Dokploy Traefik listener during domain migration
  ansible.builtin.command:
    argv:
      - docker
      - container
      - inspect
      - dokploy-traefik
  register: security_legacy_dokploy_traefik_inspect
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true
  when:
    - "'tcp|3000' in security_public_listeners.stdout_lines"
    - (platform | default({})).get('dokploy', {}).get('enabled', false) | bool
    - (domains | default({})).get('base', '') | length > 0

- name: Read the legacy Dokploy Traefik metadata
  ansible.builtin.set_fact:
    security_legacy_dokploy_traefik_metadata: >-
      {{ security_legacy_dokploy_traefik_inspect.stdout | from_json | first | default({}, true) }}
  when:
    - security_legacy_dokploy_traefik_inspect is defined
    - security_legacy_dokploy_traefik_inspect.rc | default(-1) == 0
  no_log: true

- name: Initialize legacy Dokploy management listener recognition
  ansible.builtin.set_fact:
    security_legacy_dokploy_management_listener_is_owned: false
    security_legacy_dokploy_management_listener_ids: []

- name: Recognize only the Foundry-owned legacy Dokploy management listener
  ansible.builtin.set_fact:
    security_legacy_dokploy_management_listener_is_owned: true
  when:
    - security_legacy_dokploy_traefik_metadata is defined
    - (security_legacy_dokploy_traefik_metadata.Config.Labels | default({})).get('foundry.managed') == 'true'
    - (security_legacy_dokploy_traefik_metadata.Config.Labels | default({})).get('foundry.project') == project.name
    - (security_legacy_dokploy_traefik_metadata.Config.Labels | default({})).get('foundry.service') == 'traefik'
    - >-
      ((security_legacy_dokploy_traefik_metadata.NetworkSettings.Ports | default({})).get('3000/tcp', [])
       | selectattr('HostIp', 'equalto', '0.0.0.0')
       | selectattr('HostPort', 'equalto', '3000') | list | length) == 1
  no_log: true

- name: Permit the recognized legacy Dokploy management listener for one convergence
  ansible.builtin.set_fact:
    security_legacy_dokploy_management_listener_ids: ["tcp|3000"]
  when: security_legacy_dokploy_management_listener_is_owned

- name: Resolve declared exposure socket identities
  ansible.builtin.set_fact:
    security_expected_internal_listener_ids: >-
      {{
        ['tcp|2377', 'tcp|7946', 'udp|4789', 'udp|7946']
        if (
          (platform | default({})).get('swarm', {}).get('enabled', false) | bool
          or (platform | default({})).get('dokploy', {}).get('enabled', false) | bool
        ) else []
      }}
    security_declared_listener_ids: >-
      {{
        security_network_exposure_config
        | map(attribute='protocol')
        | zip(security_network_exposure_config | map(attribute='port') | map('string'))
        | map('join', '|') | list | unique | sort
      }}
    security_unexpected_listener_ids: >-
      {{
        security_public_listeners.stdout_lines
        | difference(
            security_network_exposure_config
            | map(attribute='protocol')
            | zip(security_network_exposure_config | map(attribute='port') | map('string'))
            | map('join', '|') | list
            + (
                ['tcp|2377', 'tcp|7946', 'udp|4789', 'udp|7946']
                if (
                  (platform | default({})).get('swarm', {}).get('enabled', false) | bool
                  or (platform | default({})).get('dokploy', {}).get('enabled', false) | bool
                ) else []
              ) + security_legacy_dokploy_management_listener_ids
          ) | sort
      }}

- name: Ensure internal single-node Swarm listeners are not allowed through UFW
  ansible.builtin.assert:
    that:
      - >-
        security_ufw_numbered_status.stdout is not search(
          '(?m)^\\[\\s*[0-9]+\\]\\s+(2377/tcp|7946/tcp|7946/udp|4789/udp)\\s+ALLOW IN'
        )
    fail_msg: >-
      Single-node Swarm control or overlay ports must remain blocked by UFW;
      Foundry does not expose them until a future approved multi-node policy exists.
  when:
    - security_resolved.firewall.enabled
    - security_expected_internal_listener_ids | length > 0

- name: Fail on unexpected public listeners when policy requires it
  ansible.builtin.assert:
    that:
      - security_unexpected_listener_ids | length == 0
    fail_msg: "Unexpected wildcard listeners: {{ security_unexpected_listener_ids | join(', ') }}"
  when: security_resolved.firewall.unexpected_listener_policy == 'fail'

- name: Warn about unexpected public listeners
  ansible.builtin.debug:
    msg: >-
      SECURITY WARNING: wildcard listeners are not declared in network.exposure:
      {{ security_unexpected_listener_ids | join(', ') }}
  when:
    - security_resolved.firewall.unexpected_listener_policy == 'warn'
    - security_unexpected_listener_ids | length > 0
