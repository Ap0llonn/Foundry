---
- name: Read effective APT configuration
  ansible.builtin.command:
    argv: [apt-config, dump]
  register: security_apt_configuration
  changed_when: false
  check_mode: false

- name: Read automatic update timer states
  ansible.builtin.command:
    argv: [systemctl, is-enabled, "{{ item }}"]
  loop: [apt-daily.timer, apt-daily-upgrade.timer]
  register: security_apt_timer_enabled
  changed_when: false
  check_mode: false
  when: security_resolved.updates.automatic_security_updates

- name: Inspect failed systemd units for update failures
  ansible.builtin.command:
    argv: [systemctl, --failed, --no-legend, --plain]
  register: security_failed_units
  changed_when: false
  failed_when: false
  check_mode: false

- name: Detect pending reboot state during validation
  ansible.builtin.stat:
    path: "{{ security_reboot_required_file }}"
  register: security_reboot_required_validation

- name: Validate effective unattended-upgrades policy and timers
  ansible.builtin.assert:
    that:
      - >-
        ('APT::Periodic::Unattended-Upgrade "'
        + (security_resolved.updates.automatic_security_updates | ternary('1', '0'))
        + '";') in security_apt_configuration.stdout
      - not security_resolved.updates.automatic_security_updates or 'Unattended-Upgrade::Automatic-Reboot "false";' in security_apt_configuration.stdout
      - >-
        not security_resolved.updates.automatic_security_updates
        or security_apt_timer_enabled.results
           | map(attribute='stdout') | reject('equalto', 'enabled') | list | length == 0
      - "'apt-daily' not in security_failed_units.stdout"
      - "'unattended-upgrades' not in security_failed_units.stdout"
      - >-
        not security_resolved.updates.automatic_security_updates
        or os_base_apt_security_origins | default([])
           | reject('in', security_apt_configuration.stdout) | list | length == 0
    fail_msg: Automatic security updates, origins, timers, or failure state are invalid.

- name: Report pending reboot detection result
  ansible.builtin.debug:
    msg: "Pending reboot: {{ security_reboot_required_validation.stat.exists }}"
