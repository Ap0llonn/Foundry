---
- name: Ensure SSH daemon is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ security_ssh_service }}"
    enabled: true
    state: started
  when: security_resolved.ssh.enabled

- name: Ensure SSH drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: security_resolved.ssh.enabled

- name: Install temporary dual-listener SSH policy
  ansible.builtin.include_tasks: apply_ssh_policy.yml
  vars:
    security_ssh_policy_phase: transition
  when: security_resolved.ssh.enabled

- name: Switch Ansible to a newly authenticated SSH connection
  ansible.builtin.include_tasks: migrate_ssh_connection.yml
  when:
    - security_resolved.ssh.enabled
    - not ansible_check_mode
    - security_active_management_port | int != security_resolved.ssh.port | int

- name: Resolve final single-listener SSH policy
  ansible.builtin.set_fact:
    security_ssh_ports:
      - "{{ security_resolved.ssh.port | int }}"
  when: security_resolved.ssh.enabled

- name: Install final desired-port-only SSH policy
  ansible.builtin.include_tasks: apply_ssh_policy.yml
  vars:
    security_ssh_policy_phase: final
  when: security_resolved.ssh.enabled

- name: Remove Foundry SSH policy when SSH is explicitly disabled
  ansible.builtin.file:
    path: "{{ security_sshd_dropin }}"
    state: absent
  when: not security_resolved.ssh.enabled

- name: Stop and disable SSH when explicitly allowed local provisioning requests it
  ansible.builtin.systemd_service:
    name: "{{ security_ssh_service }}"
    enabled: false
    state: stopped
  when: not security_resolved.ssh.enabled
