---
- name: Resolve steady-state firewall rules
  ansible.builtin.set_fact:
    security_firewall_transition_rules: >-
      {{
        security_firewall_rules
        | selectattr('name', 'equalto', 'foundry-ssh-transition')
        | list
      }}
    security_firewall_rules: >-
      {{
        security_firewall_rules
        | rejectattr('name', 'equalto', 'foundry-ssh-transition')
        | list
      }}

- name: Remove temporary previous-port firewall access
  community.general.ufw:
    rule: allow
    to_port: "{{ item.port | string }}"
    proto: "{{ item.protocol }}"
    from_ip: "{{ item.source }}"
    delete: true
  loop: "{{ security_firewall_transition_rules }}"
  loop_control:
    label: "{{ item.source }} -> {{ item.port }}/{{ item.protocol }}"
  when:
    - security_resolved.firewall.enabled
    - security_active_management_port | int != security_resolved.ssh.port | int

- name: Persist steady-state Foundry firewall rules
  ansible.builtin.copy:
    dest: "{{ security_firewall_state_file }}"
    owner: root
    group: root
    mode: "0600"
    content: "{{ security_firewall_rules | to_nice_yaml(indent=2) }}"
  when: security_resolved.firewall.enabled

- name: Verify previous SSH port no longer accepts connections
  ansible.builtin.wait_for:
    host: "{{ ansible_host | default(inventory_hostname) }}"
    port: "{{ security_active_management_port | int }}"
    state: stopped
    connect_timeout: 2
    timeout: "{{ security_ssh_probe_timeout }}"
  delegate_to: localhost
  become: false
  check_mode: false
  when:
    - security_resolved.ssh.enabled
    - not ansible_check_mode
    - security_active_management_port | int != security_resolved.ssh.port | int

- name: Create controller connection state directory
  ansible.builtin.file:
    path: "{{ security_controller_state_directory }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Persist validated SSH management endpoint on the controller
  ansible.builtin.copy:
    dest: "{{ security_controller_state_file }}"
    mode: "0600"
    content: |
      ---
      current_port: {{ security_resolved.ssh.port | int }}
  delegate_to: localhost
  become: false
  when: security_resolved.ssh.enabled
