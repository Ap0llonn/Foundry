---
- name: Ensure SSH daemon is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ security_ssh_service }}"
    enabled: true
    state: started
  when: security_resolved.ssh.enabled

- name: Ensure SSH drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: security_resolved.ssh.enabled
