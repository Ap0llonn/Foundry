---
- name: Migrate the live Ansible SSH connection
  block:
    - name: Wait for a new SSH banner on the desired port
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: "{{ security_resolved.ssh.port | int }}"
        state: started
        search_regex: '^SSH-'
        connect_timeout: 2
        timeout: "{{ security_ssh_probe_timeout }}"
      delegate_to: localhost
      become: false
      check_mode: false

    - name: Select desired SSH port for subsequent tasks
      ansible.builtin.set_fact:
        ansible_port: "{{ security_resolved.ssh.port | int }}"

    - name: Close the existing persistent SSH connection
      ansible.builtin.meta: reset_connection

    - name: Establish a fresh authenticated connection on the desired port
      ansible.builtin.wait_for_connection:
        connect_timeout: 5
        sleep: 1
        timeout: "{{ security_ssh_connection_timeout }}"
      check_mode: false

    - name: Prove fresh connection authentication
      ansible.builtin.command:
        argv: [/usr/bin/true]
      become: false
      changed_when: false
      check_mode: false

    - name: Prove fresh connection privilege elevation
      ansible.builtin.command:
        argv: [/usr/bin/id, -u]
      become: true
      register: security_new_connection_uid
      changed_when: false
      check_mode: false

    - name: Validate fresh connection elevation result
      ansible.builtin.assert:
        that:
          - security_new_connection_uid.stdout == '0'
        fail_msg: New SSH endpoint authenticates but cannot elevate privileges.

  rescue:
    - name: Restore Ansible connection state to previous SSH port
      ansible.builtin.set_fact:
        ansible_port: "{{ security_active_management_port | int }}"

    - name: Close the failed desired-port connection
      ansible.builtin.meta: reset_connection

    - name: Reconnect through preserved previous SSH port
      ansible.builtin.wait_for_connection:
        connect_timeout: 5
        sleep: 1
        timeout: "{{ security_ssh_connection_timeout }}"
      check_mode: false

    - name: Stop before retiring the known-good management endpoint
      ansible.builtin.fail:
        msg: >-
          Fresh authentication or elevation on port {{ security_resolved.ssh.port }}
          failed. Foundry restored port {{ security_active_management_port }} and
          preserved both SSH listeners and firewall rules for recovery.
