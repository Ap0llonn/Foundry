---
- name: Initialize resolved Foundry firewall rules
  ansible.builtin.set_fact:
    security_firewall_candidate_rules: >-
      {{
        security_resolved.firewall.additional_rules
        + (security_firewall_derived_rules if security_resolved.firewall.automatic_rules else [])
      }}
    security_firewall_rules: []
    security_firewall_rule_ids: []

- name: Add automatic desired SSH firewall rule
  ansible.builtin.set_fact:
    security_firewall_candidate_rules: >-
      {{
        security_firewall_candidate_rules
        + [{
          'name': 'foundry-ssh',
          'port': security_resolved.ssh.port | int,
          'protocol': 'tcp',
          'source': 'any'
        }]
      }}
  when:
    - security_resolved.firewall.automatic_rules
    - security_resolved.ssh.enabled

- name: Add automatic transition rule for active SSH management port
  ansible.builtin.set_fact:
    security_firewall_candidate_rules: >-
      {{
        security_firewall_candidate_rules
        + [{
          'name': 'foundry-ssh-transition',
          'port': security_active_management_port | int,
          'protocol': 'tcp',
          'source': 'any'
        }]
      }}
  when:
    - security_resolved.firewall.automatic_rules
    - security_resolved.ssh.enabled
    - security_active_management_port | int != security_resolved.ssh.port | int

- name: Normalize and deduplicate Foundry firewall rules
  ansible.builtin.set_fact:
    security_firewall_rules: >-
      {{
        security_firewall_rules
        + [{
          'name': item.name | default('foundry-' + (item.port | string) + '-' + item.protocol),
          'port': item.port | int,
          'protocol': item.protocol,
          'source': item.source | default('any')
        }]
      }}
    security_firewall_rule_ids: >-
      {{
        security_firewall_rule_ids
        + [(item.source | default('any')) + '|' + (item.port | string) + '|' + item.protocol]
      }}
  when: >-
    (item.source | default('any')) + '|' + (item.port | string) + '|' + item.protocol
    not in security_firewall_rule_ids
  loop: "{{ security_firewall_candidate_rules }}"
  loop_control:
    label: "{{ item.name | default(item.port) }}"

- name: Create Foundry firewall state directory
  ansible.builtin.file:
    path: "{{ security_firewall_state_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  when: security_resolved.firewall.enabled

- name: Inspect previous Foundry firewall state
  ansible.builtin.stat:
    path: "{{ security_firewall_state_file }}"
  register: security_firewall_state_file_check
  when: security_resolved.firewall.enabled

- name: Read previous Foundry firewall state
  ansible.builtin.slurp:
    path: "{{ security_firewall_state_file }}"
  register: security_firewall_previous_state_raw
  when:
    - security_resolved.firewall.enabled
    - security_firewall_state_file_check.stat.exists

- name: Resolve previous Foundry firewall rules
  ansible.builtin.set_fact:
    security_firewall_previous_rules: >-
      {{
        (security_firewall_previous_state_raw.content | b64decode | from_yaml)
        if security_firewall_state_file_check.stat.exists
        else []
      }}
  when: security_resolved.firewall.enabled

- name: Configure default incoming firewall policy
  community.general.ufw:
    direction: incoming
    default: "{{ security_resolved.firewall.default_incoming }}"
  when: security_resolved.firewall.enabled

- name: Configure default outgoing firewall policy
  community.general.ufw:
    direction: outgoing
    default: "{{ security_resolved.firewall.default_outgoing }}"
  when: security_resolved.firewall.enabled

- name: Allow resolved Foundry firewall rules
  community.general.ufw:
    rule: allow
    to_port: "{{ item.port | string }}"
    proto: "{{ item.protocol }}"
    from_ip: "{{ item.source }}"
    comment: "{{ item.name }}"
  loop: "{{ security_firewall_rules }}"
  loop_control:
    label: "{{ item.source }} -> {{ item.port }}/{{ item.protocol }}"
  when: security_resolved.firewall.enabled

- name: Remove stale Foundry-managed firewall rules
  community.general.ufw:
    rule: allow
    to_port: "{{ item.port | string }}"
    proto: "{{ item.protocol }}"
    from_ip: "{{ item.source }}"
    delete: true
  when:
    - security_resolved.firewall.enabled
    - item.source + '|' + (item.port | string) + '|' + item.protocol not in security_firewall_rule_ids
  loop: "{{ security_firewall_previous_rules | default([]) }}"
  loop_control:
    label: "{{ item.source }} -> {{ item.port }}/{{ item.protocol }}"

- name: Persist Foundry-managed firewall state
  ansible.builtin.copy:
    dest: "{{ security_firewall_state_file }}"
    owner: root
    group: root
    mode: "0600"
    content: "{{ security_firewall_rules | to_nice_yaml(indent=2) }}"
  when: security_resolved.firewall.enabled

- name: Enable UFW after management rules exist
  community.general.ufw:
    state: enabled
  when: security_resolved.firewall.enabled

- name: Disable UFW when host firewall policy is disabled
  community.general.ufw:
    state: disabled
  when: not security_resolved.firewall.enabled
