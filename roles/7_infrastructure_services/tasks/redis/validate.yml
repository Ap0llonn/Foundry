---
- name: Require Dokploy Redis validation context
  ansible.builtin.assert:
    that:
      - infrastructure_services_dokploy_api_key | default('') | length > 0
      - infrastructure_services_dokploy_api_url | default('') | length > 0
      - infrastructure_services_dokploy_api_network | default('') | length > 0
      - infrastructure_services_dokploy_redis_contracts | default({}) | length == infrastructure_services_redis_instances | length
    fail_msg: Dokploy Redis validation requires the resolved API context and service contracts.
  no_log: true

- name: Read Dokploy Redis health after host reboot
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - "{{ infrastructure_services_dokploy_api_network }}"
      - curlimages/curl:8.15.0
      - --fail-with-body
      - --silent
      - --show-error
      - --header
      - "x-api-key: {{ infrastructure_services_dokploy_api_key }}"
      - >-
        {{ infrastructure_services_dokploy_api_url }}/api/redis.one?redisId={{ infrastructure_services_dokploy_redis_contracts[item.environment].redis_id }}
  register: infrastructure_services_dokploy_redis_health
  changed_when: false
  failed_when: >-
    infrastructure_services_dokploy_redis_health.rc != 0
    or (infrastructure_services_dokploy_redis_health.stdout | from_json).get('applicationStatus', '') not in ['running', 'done']
  loop: "{{ infrastructure_services_redis_instances }}"
  loop_control:
    label: "{{ item.environment }}"
  no_log: true
