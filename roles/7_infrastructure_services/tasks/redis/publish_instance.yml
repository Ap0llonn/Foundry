---
- name: Add Redis endpoint and optional backup metadata
  ansible.builtin.set_fact:
    foundry_resolved_services: >-
      {{
        foundry_resolved_services | combine({
          redis_instance.environment: {
            'redis': {
              'host': infrastructure_services_dokploy_redis_contracts[redis_instance.environment].service_name,
              'port': 6379,
              'service_name': infrastructure_services_dokploy_redis_contracts[redis_instance.environment].service_name,
              'dokploy_id': infrastructure_services_dokploy_redis_contracts[redis_instance.environment].redis_id,
              'environment_id': infrastructure_services_dokploy_redis_contracts[redis_instance.environment].environment_id,
              'persistence': redis_instance.persistence,
              'managed_by': 'dokploy'
            }
          }
        }, recursive=true)
      }}
    infrastructure_services_backup_targets: >-
      {{
        infrastructure_services_backup_targets
        + ([{
          'project': project.name,
          'environment': redis_instance.environment,
          'service': 'redis',
          'dokploy_id': infrastructure_services_dokploy_redis_contracts[redis_instance.environment].redis_id,
          'service_name': infrastructure_services_dokploy_redis_contracts[redis_instance.environment].service_name,
          'managed_by': 'dokploy'
        }])
      }}
  no_log: true
