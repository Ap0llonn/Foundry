---
- name: Require the resolved Dokploy Redis instance list
  ansible.builtin.assert:
    that:
      - infrastructure_services_redis_instances is defined
      - infrastructure_services_redis_instances is sequence
      - infrastructure_services_redis_instances is not string
      - project is mapping
      - project.name | default('') is string
      - project.name | default('') | length > 0
    fail_msg: Redis requires a pre-resolved instance list and project.name.
  no_log: true

- name: Validate each resolved Dokploy Redis instance contract
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.keys() | difference(['environment', 'service_name', 'image', 'password', 'password_file', 'persistence', 'maxmemory', 'maxmemory_policy', 'resources']) | length == 0
      - item.environment | default('') is match('^[a-z][a-z0-9-]{0,31}$')
      - item.service_name | default('') == 'foundry-' + item.environment + '-redis'
      - item.image | default('') is match('^.+@sha256:[a-f0-9]{64}$')
      - item.password | default('') is string
      - item.password | default('') | length >= 16
      - item.password_file | default('') is match('^/var/lib/foundry/infrastructure-services/secrets/[A-Za-z0-9._/-]+/password$')
      - item.persistence is boolean
      - item.maxmemory | string is match('^$|^(0|[1-9][0-9]*[bBkKmMgG]?)$')
      - item.maxmemory_policy in infrastructure_services_allowed_redis_policies
      - item.resources | default({}) is mapping
      - (item.resources | default({})).keys() | difference(['memory', 'cpus']) | length == 0
      - item.resources.memory | default('') | string is match('^$|^[1-9][0-9]*[bkmgBKMG]?$')
      - item.resources.cpus | default('') | string is match('^$|^[0-9]+([.][0-9]+)?$')
      - item.resources.cpus | default(1, true) | float > 0
    fail_msg: A resolved Dokploy Redis instance violates naming, image, secret, or resource policy.
  loop: "{{ infrastructure_services_redis_instances }}"
  no_log: true

- name: Require unique Redis environments, service names, and credentials
  ansible.builtin.assert:
    that:
      - infrastructure_services_redis_instances | map(attribute='environment') | unique | length == infrastructure_services_redis_instances | length
      - infrastructure_services_redis_instances | map(attribute='service_name') | unique | length == infrastructure_services_redis_instances | length
      - infrastructure_services_redis_instances | map(attribute='password') | unique | length == infrastructure_services_redis_instances | length
    fail_msg: Redis environments, service names, and credentials must be unique.
  no_log: true
