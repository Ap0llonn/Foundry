---
- name: Resolve Redis and container memory limits
  ansible.builtin.set_fact:
    infrastructure_services_redis_maxmemory_bytes: >-
      {{
        (redis_memory_instance.maxmemory | regex_replace('[A-Za-z]+$', '') | int)
        * {
          '': 1, 'b': 1, 'k': 1024, 'kb': 1024,
          'm': 1048576, 'mb': 1048576,
          'g': 1073741824, 'gb': 1073741824
        }[redis_memory_instance.maxmemory | regex_search('[A-Za-z]+$') | default('', true) | lower]
      }}
    infrastructure_services_redis_container_memory_bytes: >-
      {{
        0 if redis_memory_instance.resources.memory | default('') | length == 0
        else (
          (redis_memory_instance.resources.memory[:-1] | int)
          * {'b': 1, 'k': 1024, 'm': 1048576, 'g': 1073741824}[redis_memory_instance.resources.memory[-1:] | lower]
          if redis_memory_instance.resources.memory[-1:] | lower in ['b', 'k', 'm', 'g']
          else redis_memory_instance.resources.memory | int
        )
      }}
  no_log: true

- name: Refuse Redis maxmemory above its container memory limit
  ansible.builtin.assert:
    that:
      - >-
        infrastructure_services_redis_container_memory_bytes | int == 0
        or infrastructure_services_redis_maxmemory_bytes | int == 0
        or infrastructure_services_redis_maxmemory_bytes | int
           <= infrastructure_services_redis_container_memory_bytes | int
    fail_msg: Redis maxmemory cannot exceed its configured container memory limit.
  no_log: true
