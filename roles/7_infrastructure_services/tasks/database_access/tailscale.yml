---
- name: Install the Tailscale repository key
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/debian/bookworm.noarmor.gpg
    dest: "{{ infrastructure_services_database_access_tailscale_keyring }}"
    owner: root
    group: root
    mode: "0644"
    force: true

- name: Configure the Tailscale Debian repository
  ansible.builtin.apt_repository:
    repo: "{{ infrastructure_services_database_access_tailscale_repo }}"
    filename: tailscale
    state: present
    update_cache: true

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present

- name: Ensure Tailscale is enabled and running
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Inspect Tailscale login state
  ansible.builtin.command:
    argv: [tailscale, status, --json]
  register: infrastructure_services_database_access_tailscale_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Authenticate Tailscale and disable unrelated routing features
  ansible.builtin.command:
    argv:
      - tailscale
      - up
      - --auth-key
      - "{{ foundry_database_access_resolved.tailscale.auth_key }}"
      - --hostname
      - "{{ foundry_database_access_resolved.tailscale.hostname | default('foundry-' + project.name, true) }}"
      - --accept-dns=false
      - --accept-routes=false
      - --ssh=false
  register: infrastructure_services_database_access_tailscale_up
  changed_when: true
  when: >-
    infrastructure_services_database_access_tailscale_status.rc != 0
    or infrastructure_services_database_access_tailscale_status.stdout
       is not search('"BackendState"\s*:\s*"Running"')
  no_log: true

- name: Apply the desired Tailscale machine hostname
  ansible.builtin.command:
    argv:
      - tailscale
      - set
      - --hostname
      - "{{ foundry_database_access_resolved.tailscale.hostname | default('foundry-' + project.name, true) }}"
  register: infrastructure_services_database_access_tailscale_hostname
  changed_when: true
  when: foundry_database_access_resolved.tailscale.hostname | length > 0
  no_log: true

- name: Read the Tailscale IPv4 address
  ansible.builtin.command:
    argv: [tailscale, ip, -4]
  register: infrastructure_services_database_access_tailscale_ip_raw
  changed_when: false
  retries: 10
  delay: 2
  until:
    - infrastructure_services_database_access_tailscale_ip_raw.rc == 0
    - infrastructure_services_database_access_tailscale_ip_raw.stdout is match('^100[.]')

- name: Publish the Tailscale database access address
  ansible.builtin.set_fact:
    foundry_database_access_tailscale_ip: "{{ infrastructure_services_database_access_tailscale_ip_raw.stdout | trim }}"
