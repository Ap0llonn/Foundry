---
- name: Validate exact Dokploy service replica state
  ansible.builtin.command:
    argv:
      - docker
      - service
      - ls
      - --format
      - "{{ '{{.Name}} {{.Replicas}}' }}"
  loop:
    - "{{ infrastructure_services_dokploy_postgres_service_name }}"
    - "{{ infrastructure_services_dokploy_service_name }}"
  register: infrastructure_services_dokploy_service_health
  changed_when: false
  failed_when: >-
    (
      infrastructure_services_dokploy_service_health.stdout_lines
      | select('equalto', item ~ ' 1/1')
      | list
      | length
    ) != 1

- name: Resolve the local Dokploy application task container
  ansible.builtin.command:
    argv:
      - docker
      - container
      - ls
      - --quiet
      - --filter
      - "label=com.docker.swarm.service.name={{ infrastructure_services_dokploy_service_name }}"
  register: infrastructure_services_dokploy_task_container
  changed_when: false
  failed_when: >-
    infrastructure_services_dokploy_task_container.rc != 0
    or infrastructure_services_dokploy_task_container.stdout_lines | length != 1

- name: Probe Dokploy application health
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - "{{ foundry_platform_resolved.traefik.ingress_network }}"
      - curlimages/curl:8.15.0
      - --fail
      - --silent
      - --show-error
      - "{{ infrastructure_services_dokploy_internal_endpoint }}/api/trpc/settings.health"
  register: infrastructure_services_dokploy_health_probe
  changed_when: false
  retries: "{{ infrastructure_services_health_retries }}"
  delay: "{{ infrastructure_services_health_delay }}"
  until: infrastructure_services_dokploy_health_probe.rc == 0

- name: Inspect Dokploy registration state
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - "{{ foundry_platform_resolved.traefik.ingress_network }}"
      - curlimages/curl:8.15.0
      - --silent
      - --output
      - /dev/null
      - --write-out
      - "%{http_code} %{redirect_url}"
      - "{{ infrastructure_services_dokploy_internal_endpoint }}/register"
  register: infrastructure_services_dokploy_registration_probe
  changed_when: false
  failed_when: infrastructure_services_dokploy_registration_probe.rc != 0

- name: Resolve and validate Dokploy onboarding state
  ansible.builtin.set_fact:
    infrastructure_services_dokploy_onboarding_required: >-
      {{
        infrastructure_services_dokploy_registration_probe.stdout
        is match('^200 ')
      }}
  failed_when: >-
    infrastructure_services_dokploy_registration_probe.stdout
    is not match('^(200|301|302|307|308) ')

- name: Report mandatory Dokploy onboarding state
  ansible.builtin.debug:
    msg: >-
      Dokploy is healthy at {{ infrastructure_services_dokploy_endpoint }}.
      Initial administrator onboarding required={{
        infrastructure_services_dokploy_onboarding_required
      }}.
