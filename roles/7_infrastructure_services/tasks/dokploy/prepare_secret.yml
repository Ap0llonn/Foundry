---
- name: Inspect stable {{ infrastructure_services_dokploy_secret_key }} source
  ansible.builtin.stat:
    path: "{{ infrastructure_services_dokploy_secret_file }}"
    follow: false
  register: infrastructure_services_dokploy_secret_file_check

- name: Refuse unsafe existing {{ infrastructure_services_dokploy_secret_key }} source before writing
  ansible.builtin.assert:
    that:
      - not infrastructure_services_dokploy_secret_file_check.stat.islnk | default(false)
      - not infrastructure_services_dokploy_secret_file_check.stat.exists or infrastructure_services_dokploy_secret_file_check.stat.isreg
      - not infrastructure_services_dokploy_secret_file_check.stat.exists or infrastructure_services_dokploy_secret_file_check.stat.pw_name == 'root'
      - not infrastructure_services_dokploy_secret_file_check.stat.exists or infrastructure_services_dokploy_secret_file_check.stat.mode == '0600'
    fail_msg: Existing Dokploy secret source is unsafe; refusing to read or overwrite it.
  no_log: true

- name: Generate missing {{ infrastructure_services_dokploy_secret_key }}
  ansible.builtin.command:
    argv: [openssl, rand, -hex, "32"]
  register: infrastructure_services_dokploy_generated_secret
  changed_when: true
  when:
    - not infrastructure_services_dokploy_secret_file_check.stat.exists
    - infrastructure_services_dokploy_secret_external_value | length == 0
  no_log: true

- name: Read existing {{ infrastructure_services_dokploy_secret_key }} before accepting an override
  ansible.builtin.slurp:
    path: "{{ infrastructure_services_dokploy_secret_file }}"
  register: infrastructure_services_dokploy_existing_secret_raw
  when:
    - infrastructure_services_dokploy_secret_file_check.stat.exists
    - infrastructure_services_dokploy_secret_external_value | length > 0
  no_log: true

- name: Refuse unversioned {{ infrastructure_services_dokploy_secret_key }} rotation
  ansible.builtin.assert:
    that:
      - infrastructure_services_dokploy_existing_secret_raw.content | b64decode | trim == infrastructure_services_dokploy_secret_external_value
    fail_msg: Increment platform.dokploy.secret_version to rotate Dokploy credentials explicitly.
  when:
    - infrastructure_services_dokploy_secret_file_check.stat.exists
    - infrastructure_services_dokploy_secret_external_value | length > 0
  no_log: true

- name: Install stable {{ infrastructure_services_dokploy_secret_key }} source
  ansible.builtin.copy:
    dest: "{{ infrastructure_services_dokploy_secret_file }}"
    owner: root
    group: root
    mode: "0600"
    content: >-
      {{
        infrastructure_services_dokploy_secret_external_value + '\n'
        if infrastructure_services_dokploy_secret_external_value | length > 0
        else infrastructure_services_dokploy_generated_secret.stdout + '\n'
      }}
    force: false
  when: not infrastructure_services_dokploy_secret_file_check.stat.exists
  no_log: true

- name: Validate stable {{ infrastructure_services_dokploy_secret_key }} source permissions
  ansible.builtin.stat:
    path: "{{ infrastructure_services_dokploy_secret_file }}"
    follow: false
  register: infrastructure_services_dokploy_secret_final

- name: Refuse unsafe {{ infrastructure_services_dokploy_secret_key }} source
  ansible.builtin.assert:
    that:
      - infrastructure_services_dokploy_secret_final.stat.isreg
      - not infrastructure_services_dokploy_secret_final.stat.islnk
      - infrastructure_services_dokploy_secret_final.stat.pw_name == 'root'
      - infrastructure_services_dokploy_secret_final.stat.mode == '0600'
    fail_msg: Dokploy secret state is missing, symlinked, or has unsafe ownership/permissions.
  no_log: true
