# Configure the Dokploy project and environments after Dokploy is healthy.
#
# The API key is generated by dokploy/bootstrap.yml after the owner session is
# established, then persisted in the root-only Dokploy secret directory.
#
# This file owns the Dokploy project/environment hierarchy. Service resources
# are reconciled by their dedicated API-backed task after this hierarchy is
# healthy and all environment identifiers are known.

- name: Resolve Dokploy project configuration
  ansible.builtin.set_fact:
    infrastructure_services_dokploy_project_name: "{{ project.name }}"
    infrastructure_services_dokploy_environment_names: >-
      {{ infrastructure_services_environment_names | list }}
    infrastructure_services_dokploy_api_url: >-
      {{ infrastructure_services_dokploy_internal_endpoint }}
    infrastructure_services_dokploy_api_network: >-
      {{ foundry_platform_resolved.traefik.ingress_network }}
  no_log: true

- name: Resolve persisted Dokploy API key path
  ansible.builtin.set_fact:
    infrastructure_services_dokploy_api_key_file: >-
      {{ infrastructure_services_secret_directory }}/{{ project.name }}/dokploy/api-key-{{ foundry_platform_resolved.dokploy.secret_version }}
  no_log: true

- name: Inspect persisted Dokploy API key
  ansible.builtin.stat:
    path: "{{ infrastructure_services_dokploy_api_key_file }}"
    follow: false
  register: infrastructure_services_dokploy_configure_api_key_file
  no_log: true

- name: Validate persisted Dokploy API key permissions
  ansible.builtin.assert:
    that:
      - not infrastructure_services_dokploy_configure_api_key_file.stat.islnk | default(false)
      - infrastructure_services_dokploy_configure_api_key_file.stat.isreg
      - infrastructure_services_dokploy_configure_api_key_file.stat.pw_name == 'root'
      - infrastructure_services_dokploy_configure_api_key_file.stat.mode == '0600'
    fail_msg: >-
      Dokploy API key state exists but is not a root-owned 0600 regular file.
  when: infrastructure_services_dokploy_configure_api_key_file.stat.exists
  no_log: true

- name: Read persisted Dokploy API key when not already in memory
  ansible.builtin.slurp:
    path: "{{ infrastructure_services_dokploy_api_key_file }}"
  register: infrastructure_services_dokploy_configure_api_key_raw
  when:
    - infrastructure_services_dokploy_api_key | default('') | length == 0
    - infrastructure_services_dokploy_configure_api_key_file.stat.exists
  no_log: true

- name: Resolve Dokploy API key for configuration
  ansible.builtin.set_fact:
    infrastructure_services_dokploy_api_key: >-
      {{
        infrastructure_services_dokploy_configure_api_key_raw.content
        | b64decode
        | trim
      }}
  when:
    - infrastructure_services_dokploy_api_key | default('') | length == 0
    - infrastructure_services_dokploy_configure_api_key_file.stat.exists
  no_log: true

- name: Require Dokploy configuration inputs
  ansible.builtin.assert:
    that:
      - infrastructure_services_dokploy_project_name | length > 0
      - infrastructure_services_dokploy_environment_names | length > 0
      - infrastructure_services_dokploy_api_key | default('') | string | length > 0
      - infrastructure_services_dokploy_api_url | length > 0
      - infrastructure_services_dokploy_api_network | length > 0
    fail_msg: >-
      Dokploy configuration requires project.name, at least one environment,
      and a dynamically resolved infrastructure_services_dokploy_api_key.
  no_log: true

# ---------------------------------------------------------------------------
# Project
# ---------------------------------------------------------------------------

- name: Read existing Dokploy projects
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - "{{ infrastructure_services_dokploy_api_network }}"
      - curlimages/curl:8.15.0
      - --fail-with-body
      - --silent
      - --show-error
      - --header
      - "x-api-key: {{ infrastructure_services_dokploy_api_key }}"
      - "{{ infrastructure_services_dokploy_api_url }}/api/project.all"
  register: infrastructure_services_dokploy_projects_raw
  changed_when: false

- name: Parse existing Dokploy projects
  ansible.builtin.set_fact:
    infrastructure_services_dokploy_projects: >-
      {{ infrastructure_services_dokploy_projects_raw.stdout | from_json }}
  no_log: true

- name: Resolve matching Dokploy projects
  ansible.builtin.set_fact:
    infrastructure_services_dokploy_project_matches: >-
      {{
        infrastructure_services_dokploy_projects
        | selectattr('name', 'equalto', infrastructure_services_dokploy_project_name)
        | list
      }}
  no_log: true

- name: Reject ambiguous Dokploy project ownership
  ansible.builtin.assert:
    that:
      - infrastructure_services_dokploy_project_matches | length <= 1
    fail_msg: >-
      More than one Dokploy project has the requested Foundry project name.
      Refusing ambiguous ownership.
  no_log: true

- name: Create missing Dokploy project
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - "{{ infrastructure_services_dokploy_api_network }}"
      - curlimages/curl:8.15.0
      - --fail-with-body
      - --silent
      - --show-error
      - --request
      - POST
      - --header
      - "x-api-key: {{ infrastructure_services_dokploy_api_key }}"
      - --header
      - "Content-Type: application/json"
      - --data
      - "{{ {'name': infrastructure_services_dokploy_project_name} | to_json }}"
      - "{{ infrastructure_services_dokploy_api_url }}/api/project.create"
  when: infrastructure_services_dokploy_project_matches | length == 0
  changed_when: true
  no_log: true

- name: Re-read Dokploy projects
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - "{{ infrastructure_services_dokploy_api_network }}"
      - curlimages/curl:8.15.0
      - --fail-with-body
      - --silent
      - --show-error
      - --header
      - "x-api-key: {{ infrastructure_services_dokploy_api_key }}"
      - "{{ infrastructure_services_dokploy_api_url }}/api/project.all"
  register: infrastructure_services_dokploy_projects_after_raw
  changed_when: false
  no_log: true

- name: Resolve exact Dokploy project
  ansible.builtin.set_fact:
    infrastructure_services_dokploy_project: >-
      {{
        infrastructure_services_dokploy_projects_after_raw.stdout
        | from_json
        | selectattr('name', 'equalto', infrastructure_services_dokploy_project_name)
        | list
        | first
        | default({}, true)
      }}
  no_log: true

- name: Resolve Dokploy project identifier
  ansible.builtin.set_fact:
    infrastructure_services_dokploy_project_id: >-
      {{
        infrastructure_services_dokploy_project.get(
          'projectId',
          infrastructure_services_dokploy_project.get('id', '')
        )
      }}
  no_log: true

- name: Require exact Dokploy project identity
  ansible.builtin.assert:
    that:
      - infrastructure_services_dokploy_project_id | string | length > 0
    fail_msg: >-
      Dokploy project exists but Foundry could not resolve its identifier.
  no_log: true

# ---------------------------------------------------------------------------
# Environments
# ---------------------------------------------------------------------------

- name: Read Dokploy environments for project
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - "{{ infrastructure_services_dokploy_api_network }}"
      - curlimages/curl:8.15.0
      - --fail-with-body
      - --silent
      - --show-error
      - --header
      - "x-api-key: {{ infrastructure_services_dokploy_api_key }}"
      - >-
        {{ infrastructure_services_dokploy_api_url }}/api/environment.byProjectId?projectId={{ infrastructure_services_dokploy_project_id }}
  register: infrastructure_services_dokploy_environments_raw
  changed_when: false
  no_log: true

- name: Parse existing Dokploy environments
  ansible.builtin.set_fact:
    infrastructure_services_dokploy_environments: >-
      {{ infrastructure_services_dokploy_environments_raw.stdout | from_json }}
  no_log: true

- name: Create missing Dokploy environments
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - "{{ infrastructure_services_dokploy_api_network }}"
      - curlimages/curl:8.15.0
      - --fail-with-body
      - --silent
      - --show-error
      - --request
      - POST
      - --header
      - "x-api-key: {{ infrastructure_services_dokploy_api_key }}"
      - --header
      - "Content-Type: application/json"
      - --data
      - >-
        {{ {
          'name': item,
          'projectId': infrastructure_services_dokploy_project_id
        } | to_json }}
      - "{{ infrastructure_services_dokploy_api_url }}/api/environment.create"
  loop: "{{ infrastructure_services_dokploy_environment_names }}"
  when: >-
    infrastructure_services_dokploy_environments
    | selectattr('name', 'equalto', item)
    | list
    | length == 0
  register: infrastructure_services_dokploy_environment_create_results
  changed_when: infrastructure_services_dokploy_environment_create_results.rc == 0
  failed_when: false
  no_log: true

- name: Report Dokploy environment creation error
  ansible.builtin.assert:
    that:
      - item.rc == 0
    fail_msg: >-
      Dokploy could not create environment '{{ item.item }}'
      (rc={{ item.rc }}):
      {{
        (
          item.stdout | default(item.stderr, true) | trim
        )
        | replace(
            infrastructure_services_dokploy_api_key | default(''),
            '[REDACTED]'
          )
      }}
  loop: "{{ infrastructure_services_dokploy_environment_create_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - not item.skipped | default(false)
    - item.rc | default(0) != 0

- name: Re-read Dokploy environments for project
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - "{{ infrastructure_services_dokploy_api_network }}"
      - curlimages/curl:8.15.0
      - --fail-with-body
      - --silent
      - --show-error
      - --header
      - "x-api-key: {{ infrastructure_services_dokploy_api_key }}"
      - >-
        {{ infrastructure_services_dokploy_api_url }}/api/environment.byProjectId?projectId={{ infrastructure_services_dokploy_project_id }}
  register: infrastructure_services_dokploy_environments_after_raw
  changed_when: false
  no_log: true

- name: Parse final Dokploy environments
  ansible.builtin.set_fact:
    infrastructure_services_dokploy_environments_after: >-
      {{ infrastructure_services_dokploy_environments_after_raw.stdout | from_json }}
  no_log: true

- name: Resolve Dokploy environment identifiers
  ansible.builtin.set_fact:
    infrastructure_services_dokploy_environment_map: >-
      {{
        infrastructure_services_dokploy_environment_map | default({})
        | combine({
            item: (
              (
                infrastructure_services_dokploy_environments_after
                | selectattr('name', 'equalto', item)
                | list
                | first
                | default({}, true)
              ).get(
                'environmentId',
                (
                  infrastructure_services_dokploy_environments_after
                  | selectattr('name', 'equalto', item)
                  | list
                  | first
                  | default({}, true)
                ).get('id', '')
              )
            )
          })
      }}
  loop: "{{ infrastructure_services_dokploy_environment_names }}"
  no_log: true

- name: Require all Dokploy environments
  ansible.builtin.assert:
    that:
      - infrastructure_services_dokploy_environment_map[item] | default('') | string | length > 0
    fail_msg: "Dokploy environment '{{ item }}' could not be resolved."
  loop: "{{ infrastructure_services_dokploy_environment_names }}"
  no_log: true

- name: Report Dokploy project configuration
  ansible.builtin.debug:
    msg:
      project: "{{ infrastructure_services_dokploy_project_name }}"
      project_id: "{{ infrastructure_services_dokploy_project_id }}"
      environments: "{{ infrastructure_services_dokploy_environment_map }}"
