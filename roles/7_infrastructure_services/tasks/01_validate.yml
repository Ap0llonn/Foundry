---
- name: Validate infrastructure-service root input types
  ansible.builtin.assert:
    that:
      - infrastructure_services | default({}) is mapping
      - services | default({}) is mapping
      - platform | default({}) is mapping
      - domains | default({}) is mapping
      - database_access | default({}) is mapping
      - project | default({}) is mapping
      - environments | default([]) is sequence
      - environments | default([]) is not string
    fail_msg: infrastructure_services, services, platform, domains, and project must use the documented mappings.

- name: Resolve infrastructure-service configuration defaults
  ansible.builtin.set_fact:
    infrastructure_services_resolved: >-
      {{ infrastructure_services_defaults | combine(infrastructure_services | default({}), recursive=true) }}
    foundry_services_resolved: >-
      {{ services_defaults | combine(services | default({}), recursive=true) }}
    foundry_platform_resolved: >-
      {{ platform_defaults | combine(platform | default({}), recursive=true) }}
    foundry_domains_resolved: >-
      {{ domains_defaults | combine(domains | default({}), recursive=true) }}
    foundry_database_access_resolved: >-
      {{ database_access_defaults | combine(database_access | default({}), recursive=true) }}
    infrastructure_services_environment_names: >-
      {{ environments | default([]) | map(attribute='name') | list }}
    foundry_dokploy_node_role_resolved: "{{ foundry_dokploy_node_role | default('manager') }}"
  no_log: true

- name: Validate the inventory Dokploy node role
  ansible.builtin.assert:
    that:
      - foundry_dokploy_node_role_resolved in ['manager', 'remote_server']
    fail_msg: foundry_dokploy_node_role must be manager or remote_server.

- name: Resolve whether this host owns the Dokploy control plane
  ansible.builtin.set_fact:
    foundry_dokploy_is_manager: "{{ foundry_dokploy_node_role_resolved == 'manager' }}"

- name: Validate known option names
  ansible.builtin.assert:
    that:
      - (infrastructure_services | default({})).keys() | difference(infrastructure_services_allowed_root_keys) | length == 0
      - ((infrastructure_services | default({})).get('minio', {})).keys() | difference(infrastructure_services_allowed_minio_keys) | length == 0
      - (services | default({})).keys() | difference(infrastructure_services_allowed_services_keys) | length == 0
      - ((services | default({})).get('postgres', {})).keys() | difference(infrastructure_services_allowed_postgres_keys) | length == 0
      - ((services | default({})).get('postgres', {}).get('backup', {})) is mapping
      - >-
        ((services | default({})).get('postgres', {}).get('backup', {})).keys()
        | difference(infrastructure_services_allowed_postgres_backup_keys)
        | length == 0
      - ((services | default({})).get('redis', {})).keys() | difference(infrastructure_services_allowed_redis_keys) | length == 0
      - ((services | default({})).get('object_storage', {})).keys() | difference(infrastructure_services_allowed_object_storage_keys) | length == 0
      - ((services | default({})).get('object_storage', {}).get('console', {})) is mapping
      - >-
        ((services | default({})).get('object_storage', {}).get('console', {})).keys()
        | difference(infrastructure_services_allowed_object_storage_console_keys)
        | length == 0
      - (platform | default({})).keys() | difference(infrastructure_services_allowed_platform_keys) | length == 0
      - ((platform | default({})).get('swarm', {})).keys() | difference(infrastructure_services_allowed_swarm_keys) | length == 0
      - ((platform | default({})).get('traefik', {})).keys() | difference(infrastructure_services_allowed_traefik_keys) | length == 0
      - ((platform | default({})).get('dokploy', {})).keys() | difference(infrastructure_services_allowed_dokploy_keys) | length == 0
      - ((platform | default({})).get('dokploy', {}).get('bootstrap', {})) is mapping
      - >-
        ((platform | default({})).get('dokploy', {}).get('bootstrap', {})).keys()
        | difference(infrastructure_services_allowed_dokploy_bootstrap_keys)
        | length == 0
      - ((platform | default({})).get('dokploy', {}).get('remote_servers', [])) is sequence
      - ((platform | default({})).get('dokploy', {}).get('remote_servers', [])) is not string
      - >-
        ((platform | default({})).get('dokploy', {}).get('remote_servers', [])
        | select('mapping') | list | length)
        == ((platform | default({})).get('dokploy', {}).get('remote_servers', []) | length)
      - (domains | default({})).keys() | difference(infrastructure_services_allowed_domain_keys) | length == 0
      - (domains | default({})).get('cloudflare', {}) is mapping
      - >-
        ((domains | default({})).get('cloudflare', {})).keys()
        | difference(infrastructure_services_allowed_cloudflare_keys)
        | length == 0
      - ((domains | default({})).get('cloudflare', {}).get('security', {})) is mapping
      - >-
        ((domains | default({})).get('cloudflare', {}).get('security', {})).keys()
        | difference(infrastructure_services_allowed_cloudflare_security_keys)
        | length == 0
      - ((domains | default({})).get('cloudflare', {}).get('security', {}).get('rate_limit', {})) is mapping
      - >-
        ((domains | default({})).get('cloudflare', {}).get('security', {}).get('rate_limit', {})).keys()
        | difference(infrastructure_services_allowed_cloudflare_rate_limit_keys)
        | length == 0
      - (database_access | default({})).keys() | difference(database_access_allowed_keys) | length == 0
      - ((database_access | default({})).get('tunnel', {})).keys() | difference(database_access_allowed_tunnel_keys) | length == 0
      - ((database_access | default({})).get('tailscale', {})).keys() | difference(database_access_allowed_tailscale_keys) | length == 0
      - ((database_access | default({})).get('public', {})).keys() | difference(database_access_allowed_public_keys) | length == 0
    fail_msg: Infrastructure Services contains an unsupported option. Consult roles/7_infrastructure_services/Doc.MD.

- name: Validate environment and project contracts
  ansible.builtin.assert:
    that:
      - project.name | default('') is string
      - project.name | default('') is match(infrastructure_services_identifier_pattern)
      - project.resource_prefix | default('foundry') is string
      - project.resource_prefix | default('foundry') | length == 0 or project.resource_prefix | default('foundry') is match(infrastructure_services_resource_prefix_pattern)
      - infrastructure_services_environment_names | length > 0
      - infrastructure_services_environment_names | unique | length == infrastructure_services_environment_names | length
      - infrastructure_services_environment_names | select('match', infrastructure_services_environment_pattern) | list | length == infrastructure_services_environment_names | length
    fail_msg: Project and environment names must be unique lowercase Foundry identifiers.

- name: Resolve configurable deployed-resource branding
  ansible.builtin.set_fact:
    foundry_resource_prefix: "{{ project.resource_prefix | default('foundry') }}"
    foundry_resource_name_prefix: >-
      {{ (project.resource_prefix | default('foundry')) + '-'
         if (project.resource_prefix | default('foundry')) | length > 0 else '' }}
    foundry_resource_display_name: >-
      {{
        (project.resource_prefix | default('foundry') | title)
        if (project.resource_prefix | default('foundry')) | length > 0
        else (project.name | title)
      }}

- name: Validate Dokploy Remote Server declarations
  ansible.builtin.assert:
    that:
      - item.keys() | difference(infrastructure_services_allowed_dokploy_remote_server_keys) | length == 0
      - item.name | default('') is match(infrastructure_services_identifier_pattern)
      - item.host | default('') is string
      - item.host | default('') in groups['all']
      - item.host != inventory_hostname
      - item.port | default(22) | int >= 1
      - item.port | default(22) | int <= 65535
      - item.username | default('root') == 'root'
      - item.description | default('') is string
      - item.docker_cleanup | default(true) is boolean
    fail_msg: Dokploy remote_servers entries must name a different inventory host and use root SSH.
  loop: "{{ foundry_platform_resolved.dokploy.remote_servers }}"
  loop_control:
    label: "{{ item.name | default('unnamed') }}"

- name: Validate service configuration types
  ansible.builtin.assert:
    that:
      - foundry_services_resolved.postgres is mapping
      - foundry_services_resolved.redis is mapping
      - foundry_services_resolved.object_storage is mapping
      - foundry_services_resolved.postgres.enabled is boolean
      - foundry_services_resolved.redis.enabled is boolean
      - foundry_services_resolved.object_storage.enabled is boolean
      - foundry_services_resolved.postgres.environments is sequence
      - foundry_services_resolved.postgres.environments is not string
      - foundry_services_resolved.redis.environments is sequence
      - foundry_services_resolved.redis.environments is not string
      - foundry_services_resolved.object_storage.environments is sequence
      - foundry_services_resolved.object_storage.environments is not string
      - foundry_services_resolved.postgres.credentials is mapping
      - foundry_services_resolved.postgres.database is string
      - foundry_services_resolved.postgres.backup is mapping
      - foundry_services_resolved.postgres.backup.enabled is boolean
      - foundry_services_resolved.postgres.backup.schedule is string
      - foundry_services_resolved.postgres.backup.schedule is match('^\\S+(?:\\s+\\S+){4}$')
      - foundry_services_resolved.postgres.backup.keep_latest is number
      - foundry_services_resolved.postgres.backup.keep_latest | int >= 1
      - foundry_services_resolved.redis.credentials is mapping
      - foundry_services_resolved.object_storage.credentials is mapping
      - foundry_services_resolved.postgres.major | int == 17
      - foundry_services_resolved.redis.version | string == '8.2'
      - foundry_services_resolved.postgres.resources is mapping
      - foundry_services_resolved.redis.resources is mapping
      - foundry_services_resolved.postgres.resources.keys() | difference(infrastructure_services_allowed_resource_keys) | length == 0
      - foundry_services_resolved.redis.resources.keys() | difference(infrastructure_services_allowed_resource_keys) | length == 0
      - foundry_services_resolved.object_storage.provider == 'minio'
      - foundry_services_resolved.object_storage.credentials.keys() | difference(['root_user', 'root_password']) | length == 0
      - foundry_services_resolved.object_storage.credentials.get('root_user', 'foundryadmin') is string
      - foundry_services_resolved.object_storage.credentials.get('root_user', 'foundryadmin') is match('^[a-zA-Z0-9][a-zA-Z0-9_-]{2,62}$')
      - foundry_services_resolved.object_storage.credentials.get('root_password', '') is string
      - foundry_services_resolved.object_storage.credentials.get('root_password', '') | length == 0 or foundry_services_resolved.object_storage.credentials.get('root_password', '') | length >= 16
      - foundry_services_resolved.object_storage.allow_root_filesystem is boolean
      - foundry_services_resolved.object_storage.domain_name is string
      - foundry_services_resolved.object_storage.region is string
      - foundry_services_resolved.object_storage.region is match('^[a-z]{2}-[a-z]+-[0-9]+$')
      - foundry_services_resolved.object_storage.console is mapping
      - foundry_services_resolved.object_storage.console.enabled is boolean
      - foundry_services_resolved.object_storage.console.tailscale_port is number
      - foundry_services_resolved.object_storage.console.tailscale_port | int >= 1024
      - foundry_services_resolved.object_storage.console.tailscale_port | int <= 65535
      - foundry_services_resolved.object_storage.run_as_uid is number
      - foundry_services_resolved.object_storage.run_as_uid | int >= 1
      - foundry_services_resolved.object_storage.run_as_gid is number
      - foundry_services_resolved.object_storage.run_as_gid | int >= 1
      - >-
        foundry_services_resolved.object_storage.data_root | length == 0
        or (foundry_services_resolved.object_storage.data_root is match(infrastructure_services_absolute_safe_path_pattern)
            and foundry_services_resolved.object_storage.data_root is match('^/srv/foundry(?:/|$)'))
      - foundry_services_resolved.redis.persistence is boolean
      - foundry_services_resolved.redis.maxmemory_policy in infrastructure_services_allowed_redis_policies
    fail_msg: Invalid PostgreSQL, Redis, or object-storage configuration shape.
  no_log: true

- name: Validate database access configuration
  ansible.builtin.assert:
    that:
      - foundry_database_access_resolved is mapping
      - foundry_database_access_resolved.enabled is boolean
      - foundry_database_access_resolved.mode in ['tunnel', 'tailscale', 'public']
      - foundry_database_access_resolved.environment is string
      - foundry_database_access_resolved.environment in infrastructure_services_environment_names
      - foundry_database_access_resolved.tunnel is mapping
      - foundry_database_access_resolved.tunnel.allowed_cidrs is sequence
      - foundry_database_access_resolved.tunnel.allowed_cidrs is not string
      - foundry_database_access_resolved.tunnel.local_port is number
      - foundry_database_access_resolved.tunnel.local_port | int >= 1024
      - foundry_database_access_resolved.tunnel.local_port | int <= 65535
      - foundry_database_access_resolved.tailscale is mapping
      - foundry_database_access_resolved.tailscale.auth_key is string
      - foundry_database_access_resolved.tailscale.hostname is string
      - foundry_database_access_resolved.tailscale.hostname | length == 0 or foundry_database_access_resolved.tailscale.hostname is match(infrastructure_services_identifier_pattern)
      - foundry_database_access_resolved.tailscale.port is number
      - foundry_database_access_resolved.tailscale.port | int >= 1
      - foundry_database_access_resolved.tailscale.port | int <= 65535
      - foundry_database_access_resolved.tailscale.cidr is string
      - (foundry_database_access_resolved.tailscale.cidr | ansible.utils.ipaddr) != false
      - foundry_database_access_resolved.tailscale.cidr not in ['0.0.0.0/0', '::/0']
      - foundry_database_access_resolved.public is mapping
      - foundry_database_access_resolved.public.port is number
      - foundry_database_access_resolved.public.port | int >= 1024
      - foundry_database_access_resolved.public.port | int <= 65535
      - foundry_database_access_resolved.public.acknowledge_internet_exposure is boolean
      - not foundry_database_access_resolved.enabled or foundry_services_resolved.postgres.enabled
      - >-
        not foundry_database_access_resolved.enabled
        or foundry_database_access_resolved.environment in (
          foundry_services_resolved.postgres.environments
          if foundry_services_resolved.postgres.environments | length > 0
          else infrastructure_services_environment_names
        )
      - not foundry_database_access_resolved.enabled or foundry_database_access_resolved.mode != 'tunnel' or foundry_database_access_resolved.tunnel.allowed_cidrs | length > 0
      - not foundry_database_access_resolved.enabled or foundry_database_access_resolved.mode != 'tailscale' or foundry_database_access_resolved.tailscale.auth_key | length >= 20
      - not foundry_database_access_resolved.enabled or foundry_database_access_resolved.mode != 'public' or foundry_database_access_resolved.environment == 'dev'
      - not foundry_database_access_resolved.enabled or foundry_database_access_resolved.mode != 'public' or foundry_database_access_resolved.public.acknowledge_internet_exposure
    fail_msg: >-
      Database access requires a PostgreSQL environment and either a non-empty
      tunnel CIDR whitelist, a secure Tailscale auth key, or an explicitly
      acknowledged public listener limited to the dev environment.
  no_log: true

- name: Validate database access CIDR whitelist
  ansible.builtin.assert:
    that:
      - item is string
      - (item | ansible.utils.ipaddr) != false
      - item not in ['0.0.0.0/0', '::/0']
    fail_msg: Database access tunnel CIDRs must be valid and must not be wildcard Internet ranges.
  loop: "{{ foundry_database_access_resolved.tunnel.allowed_cidrs }}"
  when:
    - foundry_database_access_resolved.enabled
    - foundry_database_access_resolved.mode == 'tunnel'
  no_log: true

- name: Validate PostgreSQL credential overrides
  ansible.builtin.assert:
    that:
      - item.value is mapping
      - item.value.keys() | difference(['password']) | length == 0
      - item.value.get('password', '') is string
      - item.value.get('password', '') | length == 0 or item.value.get('password', '') | length >= 16
    fail_msg: PostgreSQL credential overrides accept only a strong Vault-sourced password.
  loop: "{{ foundry_services_resolved.postgres.credentials | dict2items }}"
  no_log: true

- name: Validate Redis credential overrides
  ansible.builtin.assert:
    that:
      - item.value is mapping
      - item.value.keys() | difference(['password']) | length == 0
      - item.value.get('password', '') is string
      - item.value.get('password', '') | length == 0 or item.value.get('password', '') | length >= 16
    fail_msg: Redis credential overrides accept only a strong Vault-sourced password.
  loop: "{{ foundry_services_resolved.redis.credentials | dict2items }}"
  no_log: true

- name: Validate shared object-storage root credentials
  ansible.builtin.assert:
    that:
      - foundry_services_resolved.object_storage.credentials.get('root_user', 'foundryadmin') | length >= 3
      - foundry_services_resolved.object_storage.credentials.get('root_password', '') | length == 0 or foundry_services_resolved.object_storage.credentials.get('root_password', '') | length >= 16
    fail_msg: Object storage accepts only an optional shared root_user/root_password pair.
  no_log: true

- name: Resolve implicit service environment selections
  ansible.builtin.set_fact:
    infrastructure_services_postgres_environments: >-
      {{ foundry_services_resolved.postgres.environments if foundry_services_resolved.postgres.environments | length > 0 else infrastructure_services_environment_names }}
    infrastructure_services_redis_environments: >-
      {{ foundry_services_resolved.redis.environments if foundry_services_resolved.redis.environments | length > 0 else infrastructure_services_environment_names }}
    infrastructure_services_object_storage_environments: >-
      {{ foundry_services_resolved.object_storage.environments if foundry_services_resolved.object_storage.environments | length > 0 else infrastructure_services_environment_names }}
  no_log: true

- name: Validate service environment selections
  ansible.builtin.assert:
    that:
      - infrastructure_services_postgres_environments | unique | length == infrastructure_services_postgres_environments | length
      - infrastructure_services_redis_environments | unique | length == infrastructure_services_redis_environments | length
      - infrastructure_services_object_storage_environments | unique | length == infrastructure_services_object_storage_environments | length
      - infrastructure_services_postgres_environments | difference(infrastructure_services_environment_names) | length == 0
      - infrastructure_services_redis_environments | difference(infrastructure_services_environment_names) | length == 0
      - infrastructure_services_object_storage_environments | difference(infrastructure_services_environment_names) | length == 0
      - foundry_services_resolved.postgres.credentials.keys() | difference(infrastructure_services_postgres_environments) | length == 0
      - foundry_services_resolved.redis.credentials.keys() | difference(infrastructure_services_redis_environments) | length == 0
      - >-
        not foundry_services_resolved.postgres.backup.enabled
        or (
          foundry_services_resolved.object_storage.enabled
          and infrastructure_services_postgres_environments
              | difference(infrastructure_services_object_storage_environments)
              | length == 0
        )
    fail_msg: A service references an unknown/duplicate environment or credential key.
  no_log: true

- name: Validate immutable service images and resource constraints
  ansible.builtin.assert:
    that:
      - not foundry_services_resolved.postgres.enabled or foundry_services_resolved.postgres.image is match(infrastructure_services_immutable_image_pattern)
      - not foundry_services_resolved.redis.enabled or foundry_services_resolved.redis.image is match(infrastructure_services_immutable_image_pattern)
      - not foundry_services_resolved.object_storage.enabled or foundry_services_resolved.object_storage.image is match(infrastructure_services_immutable_image_pattern)
      - foundry_services_resolved.postgres.user is match('^[a-z_][a-z0-9_-]{0,62}$')
      - >-
        not foundry_services_resolved.postgres.enabled
        or (
          'database' in ((services | default({})).get('postgres', {}))
          and foundry_services_resolved.postgres.database is match('^[a-z_][a-z0-9_-]{0,62}$')
        )
      - foundry_services_resolved.postgres.resources.memory | length == 0 or foundry_services_resolved.postgres.resources.memory is match(infrastructure_services_memory_pattern)
      - foundry_services_resolved.redis.resources.memory | length == 0 or foundry_services_resolved.redis.resources.memory is match(infrastructure_services_memory_pattern)
      - foundry_services_resolved.postgres.resources.cpus | string | length == 0 or foundry_services_resolved.postgres.resources.cpus | string is match(infrastructure_services_cpu_pattern)
      - foundry_services_resolved.redis.resources.cpus | string | length == 0 or foundry_services_resolved.redis.resources.cpus | string is match(infrastructure_services_cpu_pattern)
      - foundry_services_resolved.postgres.resources.cpus | string | length == 0 or foundry_services_resolved.postgres.resources.cpus | float > 0
      - foundry_services_resolved.redis.resources.cpus | string | length == 0 or foundry_services_resolved.redis.resources.cpus | float > 0
      - foundry_services_resolved.redis.maxmemory | length == 0 or foundry_services_resolved.redis.maxmemory is match(infrastructure_services_memory_pattern)
    fail_msg: >-
      Enabled services require immutable image digests and valid resource
      settings. PostgreSQL also requires an explicit services.postgres.database
      lowercase identifier.

- name: Validate platform and domain configuration
  ansible.builtin.assert:
    that:
      - foundry_platform_resolved.swarm is mapping
      - foundry_platform_resolved.traefik is mapping
      - foundry_platform_resolved.dokploy is mapping
      - foundry_platform_resolved.swarm.enabled is boolean
      - foundry_platform_resolved.traefik.enabled is boolean
      - foundry_platform_resolved.dokploy.enabled is boolean
      - foundry_platform_resolved.traefik.tls is mapping
      - foundry_platform_resolved.traefik.tls.keys() | difference(infrastructure_services_allowed_tls_keys) | length == 0
      - foundry_platform_resolved.traefik.tls.enabled is boolean
      - foundry_platform_resolved.traefik.tls.mode is string
      - foundry_platform_resolved.traefik.tls.mode in ['public_acme', 'cloudflare_origin']
      - foundry_platform_resolved.dokploy.credentials is mapping
      - foundry_platform_resolved.dokploy.credentials.keys() | difference(['postgres_password', 'auth_secret']) | length == 0
      - foundry_platform_resolved.dokploy.secret_version is match('^[a-z0-9][a-z0-9.-]{0,31}$')
      - foundry_platform_resolved.traefik.ingress_network is match('^[a-z0-9][a-z0-9_.-]{0,62}$')
      - foundry_domains_resolved.environment_style in infrastructure_services_allowed_domain_styles
      - foundry_domains_resolved.service_names is sequence
      - foundry_domains_resolved.service_names is not string
      - foundry_domains_resolved.service_names | unique | length == foundry_domains_resolved.service_names | length
      - foundry_domains_resolved.service_names | select('match', infrastructure_services_identifier_pattern) | list | length == foundry_domains_resolved.service_names | length
      - foundry_domains_resolved.dokploy_label is match(infrastructure_services_identifier_pattern)
      - foundry_domains_resolved.base | length == 0 or foundry_domains_resolved.base is match(infrastructure_services_domain_pattern)
      - foundry_domains_resolved.cloudflare is mapping
      - foundry_domains_resolved.cloudflare.enabled is boolean
      - foundry_domains_resolved.cloudflare.proxied is boolean
      - foundry_domains_resolved.cloudflare.wildcard is boolean
      - foundry_domains_resolved.cloudflare.apex_record is boolean
      - foundry_domains_resolved.cloudflare.api_token is string
      - foundry_domains_resolved.cloudflare.zone is string
      - foundry_domains_resolved.cloudflare.ttl is number
      - foundry_domains_resolved.cloudflare.ttl | int >= 1
      - foundry_domains_resolved.cloudflare.security is mapping
      - foundry_domains_resolved.cloudflare.security.enabled is boolean
      - foundry_domains_resolved.cloudflare.security.ssl_mode == 'strict'
      - foundry_domains_resolved.cloudflare.security.always_use_https is boolean
      - foundry_domains_resolved.cloudflare.security.min_tls_version == '1.2'
      - foundry_domains_resolved.cloudflare.security.tls_1_3 is boolean
      - foundry_domains_resolved.cloudflare.security.managed_waf is boolean
      - foundry_domains_resolved.cloudflare.security.rate_limit is mapping
      - foundry_domains_resolved.cloudflare.security.rate_limit.enabled is boolean
      - foundry_domains_resolved.cloudflare.security.rate_limit.requests_per_period | int >= 1
      - foundry_domains_resolved.cloudflare.security.rate_limit.period | int >= 10
      - foundry_domains_resolved.cloudflare.security.rate_limit.period | int <= 3600
      - foundry_domains_resolved.cloudflare.security.rate_limit.mitigation_timeout | int >= 0
      - foundry_domains_resolved.cloudflare.security.rate_limit.action == 'block'
      - foundry_platform_resolved.traefik.http_port | int >= 1
      - foundry_platform_resolved.traefik.http_port | int <= 65535
      - foundry_platform_resolved.traefik.https_port | int >= 1
      - foundry_platform_resolved.traefik.https_port | int <= 65535
      - foundry_platform_resolved.dokploy.management_port | int >= 1
      - foundry_platform_resolved.dokploy.management_port | int <= 65535
      - foundry_platform_resolved.dokploy.dashboard_access is string
      - foundry_platform_resolved.dokploy.dashboard_access in ['restricted', 'public']
      - foundry_platform_resolved.swarm.subnet_size | int >= 16
      - foundry_platform_resolved.swarm.subnet_size | int <= 28
      - not foundry_platform_resolved.traefik.enabled or foundry_platform_resolved.traefik.image is match(infrastructure_services_immutable_image_pattern)
      - not foundry_platform_resolved.dokploy.enabled or foundry_platform_resolved.dokploy.image is match(infrastructure_services_immutable_image_pattern)
      - not foundry_platform_resolved.dokploy.enabled or foundry_platform_resolved.dokploy.postgres_image is match(infrastructure_services_immutable_image_pattern)
      - not foundry_platform_resolved.traefik.tls.enabled or foundry_domains_resolved.base | length > 0
      - >-
        not foundry_platform_resolved.traefik.tls.enabled
        or foundry_platform_resolved.traefik.tls.mode != 'public_acme'
        or foundry_platform_resolved.traefik.tls.email | length > 3
      - >-
        not foundry_platform_resolved.traefik.tls.enabled
        or foundry_platform_resolved.traefik.tls.mode != 'cloudflare_origin'
        or (
          foundry_domains_resolved.cloudflare.enabled
          and foundry_domains_resolved.cloudflare.proxied
          and foundry_domains_resolved.cloudflare.security.enabled
          and foundry_domains_resolved.cloudflare.security.ssl_mode == 'strict'
        )
      - >-
        not foundry_platform_resolved.dokploy.enabled
        or (((management | default({})).get('restrict_by_cidr', false) | bool
             or (management | default({})).get('allow_from_anywhere', false) | bool)
            and (management | default({})).get('allowed_cidrs', []) | length > 0)
      - >-
        not foundry_domains_resolved.cloudflare.enabled
        or (foundry_domains_resolved.base | length > 0
            and foundry_domains_resolved.cloudflare.zone == foundry_domains_resolved.base
            and foundry_domains_resolved.cloudflare.api_token | length > 0)
      - >-
        not foundry_domains_resolved.cloudflare.enabled
        or not foundry_domains_resolved.cloudflare.wildcard
        or foundry_domains_resolved.environment_style == 'hyphen'
      - >-
        not (foundry_domains_resolved.cloudflare.enabled
             and foundry_domains_resolved.cloudflare.security.enabled)
        or (foundry_domains_resolved.cloudflare.proxied
            and foundry_platform_resolved.traefik.tls.enabled)
    fail_msg: Invalid Swarm, Traefik, Dokploy, TLS, or domain configuration.

- name: Require Dokploy for API-managed PostgreSQL
  ansible.builtin.assert:
    that:
      - not foundry_services_resolved.postgres.enabled or foundry_platform_resolved.dokploy.enabled
    fail_msg: >-
      services.postgres is managed through the Dokploy API and therefore
      requires platform.dokploy.enabled=true.

- name: Resolve shared MinIO hostname
  ansible.builtin.set_fact:
    infrastructure_services_object_storage_hostname: >-
      {{
        foundry_services_resolved.object_storage.domain_name
        if foundry_services_resolved.object_storage.domain_name | length > 0
        else 'minio.' + foundry_domains_resolved.base
      }}
  when: foundry_services_resolved.object_storage.enabled

- name: Validate shared MinIO disk, domain, and Dokploy dependencies
  ansible.builtin.assert:
    that:
      - not foundry_services_resolved.object_storage.enabled or foundry_platform_resolved.dokploy.enabled
      - >-
        not foundry_services_resolved.object_storage.enabled
        or foundry_platform_resolved.traefik.enabled
        or foundry_platform_resolved.dokploy.enabled
      - not foundry_services_resolved.object_storage.enabled or foundry_platform_resolved.traefik.tls.enabled
      - not foundry_services_resolved.object_storage.enabled or foundry_domains_resolved.base | length > 0
      - not foundry_services_resolved.object_storage.enabled or foundry_services_resolved.object_storage.data_root | length > 0
      - >-
        not foundry_services_resolved.object_storage.enabled
        or foundry_services_resolved.object_storage.allow_root_filesystem
        or ((os | default({})).get('mounts', [])
            | selectattr('path', 'equalto', foundry_services_resolved.object_storage.data_root)
            | list | length == 1)
      - >-
        not foundry_services_resolved.object_storage.enabled
        or infrastructure_services_object_storage_hostname is match(infrastructure_services_domain_pattern)
      - >-
        not foundry_services_resolved.object_storage.enabled
        or infrastructure_services_object_storage_hostname.endswith('.' + foundry_domains_resolved.base)
      - >-
        not (foundry_services_resolved.object_storage.enabled
             and foundry_services_resolved.object_storage.console.enabled)
        or (foundry_database_access_resolved.enabled
            and foundry_database_access_resolved.mode == 'tailscale')
    fail_msg: >-
      Shared MinIO requires Dokploy, TLS-enabled Traefik, a hostname inside
      domains.base, and either a dedicated data_root declared in os.mounts or
      an explicit allow_root_filesystem opt-in. Its private console requires
      database_access.mode=tailscale.

- name: Validate optional Dokploy Vault secret lengths
  ansible.builtin.assert:
    that:
      - item.value is string
      - item.value | length >= 32
    fail_msg: Supplied Dokploy secrets must be at least 32 characters and loaded from Vault/external secret storage.
  loop: "{{ foundry_platform_resolved.dokploy.credentials | dict2items }}"
  no_log: true

- name: Resolve effective platform dependencies
  ansible.builtin.set_fact:
    infrastructure_services_swarm_enabled: >-
      {{ foundry_dokploy_is_manager and (foundry_platform_resolved.swarm.enabled or foundry_platform_resolved.dokploy.enabled) }}
    infrastructure_services_traefik_enabled: >-
      {{ foundry_dokploy_is_manager and (foundry_platform_resolved.traefik.enabled or foundry_platform_resolved.dokploy.enabled) }}
    infrastructure_services_domain_enabled: "{{ foundry_domains_resolved.base | length > 0 }}"
    infrastructure_services_cloudflare_proxy_enabled: false
    infrastructure_services_cloudflare_origin_cidrs: []
    infrastructure_services_any_enabled: >-
      {{
        foundry_dokploy_is_manager and (
        foundry_services_resolved.postgres.enabled
        or foundry_services_resolved.redis.enabled
        or foundry_services_resolved.object_storage.enabled
        or infrastructure_services_resolved.minio.enabled
        or foundry_platform_resolved.traefik.enabled
        or foundry_platform_resolved.dokploy.enabled
        or foundry_platform_resolved.swarm.enabled
        or foundry_database_access_resolved.enabled)
      }}

- name: Resolve planned host exposure for Security validation
  ansible.builtin.set_fact:
    infrastructure_services_effective_exposure: >-
      {{
        (network | default({})).get('exposure', [])
        + (foundry_platform_exposure_requirements | default([], true))
      }}

- name: Validate required host exposure is declared before Security convergence
  ansible.builtin.assert:
    that:
      - >-
        not infrastructure_services_traefik_enabled
        or (infrastructure_services_effective_exposure
            | selectattr('port', 'defined')
            | selectattr('port', 'equalto', foundry_platform_resolved.traefik.http_port)
            | selectattr('protocol', 'equalto', 'tcp')
            | selectattr('scope', 'equalto', 'public') | list | length > 0)
      - >-
        not (infrastructure_services_traefik_enabled and foundry_platform_resolved.traefik.tls.enabled)
        or (infrastructure_services_effective_exposure
            | selectattr('port', 'defined')
            | selectattr('port', 'equalto', foundry_platform_resolved.traefik.https_port)
            | selectattr('protocol', 'equalto', 'tcp')
            | selectattr('scope', 'equalto', 'public') | list | length > 0)
      - >-
        not (infrastructure_services_traefik_enabled and foundry_platform_resolved.traefik.tls.enabled)
        or (infrastructure_services_effective_exposure
            | selectattr('port', 'defined')
            | selectattr('port', 'equalto', foundry_platform_resolved.traefik.https_port)
            | selectattr('protocol', 'equalto', 'udp')
            | selectattr('scope', 'equalto', 'public') | list | length > 0)
      - >-
        not (foundry_platform_resolved.dokploy.enabled and not infrastructure_services_domain_enabled)
        or (infrastructure_services_effective_exposure
            | selectattr('port', 'defined')
            | selectattr('port', 'equalto', foundry_platform_resolved.dokploy.management_port)
            | selectattr('protocol', 'equalto', 'tcp')
            | selectattr('scope', 'equalto', 'management') | list | length > 0)
    fail_msg: >-
      Foundry could not resolve every required Traefik/Dokploy listener before
      Security converges UFW. Domainless Dokploy requires its management port;
      domain mode uses Traefik.

- name: Validate legacy MinIO option names and types
  ansible.builtin.assert:
    that:
      - infrastructure_services_resolved.minio.enabled is boolean
      - infrastructure_services_resolved.minio.run_as_uid is number
      - infrastructure_services_resolved.minio.run_as_uid | int >= 1
      - infrastructure_services_resolved.minio.run_as_gid is number
      - infrastructure_services_resolved.minio.run_as_gid | int >= 1
      - infrastructure_services_resolved.minio.instances is sequence
      - infrastructure_services_resolved.minio.instances is not string
      - not infrastructure_services_resolved.minio.enabled or infrastructure_services_resolved.minio.instances | length > 0
      - not (infrastructure_services_resolved.minio.enabled and foundry_services_resolved.object_storage.enabled)
    fail_msg: Invalid legacy MinIO policy, or both legacy and services.object_storage are enabled.

- name: Validate every legacy MinIO instance is a mapping
  ansible.builtin.assert:
    that: item is mapping
    fail_msg: Every legacy MinIO instance must be a mapping.
  loop: "{{ infrastructure_services_resolved.minio.instances }}"
  loop_control:
    label: "{{ item.environment | default('invalid instance') if item is mapping else 'invalid instance' }}"
  no_log: true

- name: Validate legacy MinIO instance contracts
  ansible.builtin.assert:
    that:
      - item.keys() | difference(infrastructure_services_allowed_minio_instance_keys) | length == 0
      - item.environment | default('') is match(infrastructure_services_environment_pattern)
      - item.environment in infrastructure_services_environment_names
      - item.image | default('') is match(infrastructure_services_immutable_image_pattern)
      - >-
        item.data_path | default('') | length == 0
        or (item.data_path is match(infrastructure_services_absolute_safe_path_pattern)
            and item.data_path is match('^/srv/foundry(?:/|$)'))
      - item.root_user | default('') | length >= 3
      - item.root_password | default('') | length >= 8
    fail_msg: Invalid legacy MinIO instance. Use a safe data path, immutable image, environment, and Vault credentials.
  loop: "{{ infrastructure_services_resolved.minio.instances }}"
  loop_control:
    label: "{{ item.environment | default('invalid instance') }}"
  no_log: true

- name: Require at most one legacy MinIO instance per environment
  ansible.builtin.assert:
    that:
      - infrastructure_services_resolved.minio.instances | map(attribute='environment') | unique | length == infrastructure_services_resolved.minio.instances | length
    fail_msg: Only one MinIO instance may be declared per environment.
