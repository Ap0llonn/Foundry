---
- name: Verify Docker runtime for MinIO
  ansible.builtin.command:
    argv: [docker, info]
  register: infrastructure_services_minio_docker_info
  changed_when: false
  failed_when: false
  check_mode: false

- name: Require role-6 Docker runtime before MinIO
  ansible.builtin.assert:
    that:
      - infrastructure_services_minio_docker_info.rc == 0
    fail_msg: >-
      Docker is unavailable. MinIO does not install Docker; execute role 6
      Runtime and role 5 Networking before Infrastructure Services.
