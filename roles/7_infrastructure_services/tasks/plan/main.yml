---
# Read-only controller-side planning. This runs before Security so role 4
# remains the sole firewall owner while consuming platform listener intent.
- name: Validate platform planning inputs
  ansible.builtin.assert:
    that:
      - platform | default({}) is mapping
      - domains | default({}) is mapping
      - network | default({}) is mapping
      - (network | default({})).get('exposure', []) is sequence
      - (network | default({})).get('exposure', []) is not string
    fail_msg: platform, domains, and network.exposure must use the documented mappings/list.

- name: Resolve platform exposure planning defaults
  ansible.builtin.set_fact:
    foundry_platform_plan: "{{ platform_defaults | combine(platform | default({}), recursive=true) }}"
    foundry_domain_plan: "{{ domains_defaults | combine(domains | default({}), recursive=true) }}"
    foundry_platform_exposure_requirements: []
  no_log: true

- name: Plan Traefik HTTP exposure
  ansible.builtin.set_fact:
    foundry_platform_exposure_requirements: >-
      {{ foundry_platform_exposure_requirements + [{
        'name': 'traefik-http',
        'port': foundry_platform_plan.traefik.http_port | int,
        'protocol': 'tcp',
        'scope': 'public'
      }] }}
  when: foundry_platform_plan.traefik.enabled or foundry_platform_plan.dokploy.enabled

- name: Plan Traefik HTTPS exposure
  ansible.builtin.set_fact:
    foundry_platform_exposure_requirements: >-
      {{ foundry_platform_exposure_requirements + [
        {
          'name': 'traefik-https',
          'port': foundry_platform_plan.traefik.https_port | int,
          'protocol': 'tcp',
          'scope': 'public'
        },
        {
          'name': 'traefik-http3',
          'port': foundry_platform_plan.traefik.https_port | int,
          'protocol': 'udp',
          'scope': 'public'
        }
      ] }}
  when:
    - foundry_platform_plan.traefik.enabled or foundry_platform_plan.dokploy.enabled
    - foundry_platform_plan.traefik.tls.enabled

- name: Plan domainless Dokploy management exposure
  ansible.builtin.set_fact:
    foundry_platform_exposure_requirements: >-
      {{ foundry_platform_exposure_requirements + [{
        'name': 'dokploy-management',
        'port': foundry_platform_plan.dokploy.management_port | int,
        'protocol': 'tcp',
        'scope': 'management'
      }] }}
  when:
    - foundry_platform_plan.dokploy.enabled
    - foundry_domain_plan.base | length == 0

- name: Validate predeclared platform exposure does not conflict
  ansible.builtin.assert:
    that:
      - >-
        item.name not in ((network | default({})).get('exposure', []) | map(attribute='name') | list)
        or (((network | default({})).get('exposure', []) | selectattr('name', 'equalto', item.name) | first).port | int == item.port
            and ((network | default({})).get('exposure', []) | selectattr('name', 'equalto', item.name) | first).protocol == item.protocol
            and ((network | default({})).get('exposure', []) | selectattr('name', 'equalto', item.name) | first).scope == item.scope)
    fail_msg: "network.exposure already contains a conflicting {{ item.name }} declaration."
  loop: "{{ foundry_platform_exposure_requirements }}"
  loop_control:
    label: "{{ item.name }}"

- name: Append missing platform exposure requirements
  ansible.builtin.set_fact:
    network: >-
      {{ network | default({}) | combine({
        'exposure': (network | default({})).get('exposure', []) + [item]
      }) }}
  loop: "{{ foundry_platform_exposure_requirements }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in ((network | default({})).get('exposure', []) | map(attribute='name') | list)
