---
- name: Add PostgreSQL endpoint and backup metadata
  ansible.builtin.set_fact:
    foundry_resolved_services: >-
      {{
        (foundry_resolved_services | default({})) | combine({
          postgres_instance.environment: {
            'postgres': {
              'host': infrastructure_services_dokploy_postgres_contracts[postgres_instance.environment].service_name,
              'port': 5432,
              'database': postgres_instance.database,
              'user': postgres_instance.user,
              'service_name': infrastructure_services_dokploy_postgres_contracts[postgres_instance.environment].service_name,
              'dokploy_id': infrastructure_services_dokploy_postgres_contracts[postgres_instance.environment].postgres_id,
              'environment_id': infrastructure_services_dokploy_postgres_contracts[postgres_instance.environment].environment_id
            }
          }
        }, recursive=true)
      }}
    infrastructure_services_backup_targets: >-
      {{
        (infrastructure_services_backup_targets | default([])) + [{
          'project': project.name,
          'environment': postgres_instance.environment,
          'service': 'postgres',
          'dokploy_id': infrastructure_services_dokploy_postgres_contracts[postgres_instance.environment].postgres_id,
          'service_name': infrastructure_services_dokploy_postgres_contracts[postgres_instance.environment].service_name,
          'database': postgres_instance.database,
          'managed_by': 'dokploy'
        }]
      }}
  no_log: true
