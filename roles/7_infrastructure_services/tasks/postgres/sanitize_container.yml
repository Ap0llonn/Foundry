---
- name: Record sanitized PostgreSQL compatibility
  ansible.builtin.set_fact:
    infrastructure_services_postgres_container_state: >-
      {{
        infrastructure_services_postgres_container_state + [{
          'container_name': postgres_inspection.item.container_name,
          'exists': postgres_inspection.rc == 0,
          'owned': (
            postgres_inspection.rc == 0
            and ((postgres_inspection.stdout | from_json | first).Config.Labels | default({}, true)).get('foundry.managed') == 'true'
            and ((postgres_inspection.stdout | from_json | first).Config.Labels | default({}, true)).get('foundry.project') == project.name
            and ((postgres_inspection.stdout | from_json | first).Config.Labels | default({}, true)).get('foundry.environment') == postgres_inspection.item.environment
            and ((postgres_inspection.stdout | from_json | first).Config.Labels | default({}, true)).get('foundry.service') == 'postgres'
            and ((postgres_inspection.stdout | from_json | first).Config.Labels | default({}, true)).get('foundry.resource') == 'postgres'
          ),
          'compatible': (
            postgres_inspection.rc == 0
            and ((postgres_inspection.stdout | from_json | first).Config.Labels | default({}, true)).get('foundry.managed') == 'true'
            and ((postgres_inspection.stdout | from_json | first).Config.Labels | default({}, true)).get('foundry.project') == project.name
            and ((postgres_inspection.stdout | from_json | first).Config.Labels | default({}, true)).get('foundry.environment') == postgres_inspection.item.environment
            and ((postgres_inspection.stdout | from_json | first).Config.Labels | default({}, true)).get('foundry.service') == 'postgres'
            and ((postgres_inspection.stdout | from_json | first).Config.Labels | default({}, true)).get('foundry.resource') == 'postgres'
            and (postgres_inspection.stdout | from_json | first).Config.Image == postgres_inspection.item.image
            and (postgres_inspection.stdout | from_json | first).HostConfig.RestartPolicy.Name == 'unless-stopped'
            and (postgres_inspection.stdout | from_json | first).HostConfig.PortBindings | default({}, true) | length == 0
            and (postgres_inspection.stdout | from_json | first).NetworkSettings.Networks.keys() | list == [postgres_inspection.item.network_name]
            and (postgres_inspection.stdout | from_json | first).Mounts
                | selectattr('Name', 'equalto', postgres_inspection.item.volume_name)
                | selectattr('Destination', 'equalto', '/var/lib/postgresql/data') | list | length == 1
            and ('POSTGRES_USER=' + postgres_inspection.item.user) in (postgres_inspection.stdout | from_json | first).Config.Env
            and ('POSTGRES_DB=' + postgres_inspection.item.database) in (postgres_inspection.stdout | from_json | first).Config.Env
            and 'POSTGRES_PASSWORD_FILE=/run/secrets/postgres-password' in (postgres_inspection.stdout | from_json | first).Config.Env
            and (postgres_inspection.stdout | from_json | first).Mounts
                | selectattr('Source', 'equalto', postgres_inspection.item.password_file)
                | selectattr('Destination', 'equalto', '/run/secrets/postgres-password') | list | length == 1
            and 'PGDATA=/var/lib/postgresql/data/pgdata' in (postgres_inspection.stdout | from_json | first).Config.Env
            and (postgres_inspection.stdout | from_json | first).Config.Healthcheck.Test
                == ['CMD-SHELL', 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            and (postgres_inspection.stdout | from_json | first).Config.Healthcheck.Interval == 10000000000
            and (postgres_inspection.stdout | from_json | first).Config.Healthcheck.Timeout == 5000000000
            and (postgres_inspection.stdout | from_json | first).Config.Healthcheck.Retries == 12
            and (postgres_inspection.stdout | from_json | first).Config.Healthcheck.StartPeriod == 20000000000
            and (postgres_inspection.stdout | from_json | first).HostConfig.Memory == (
              0 if postgres_inspection.item.resources.memory | default('') | length == 0
              else (
                (postgres_inspection.item.resources.memory[:-1] | int)
                * {'b': 1, 'k': 1024, 'm': 1048576, 'g': 1073741824}[postgres_inspection.item.resources.memory[-1:] | lower]
                if postgres_inspection.item.resources.memory[-1:] | lower in ['b', 'k', 'm', 'g']
                else postgres_inspection.item.resources.memory | int
              )
            )
            and (postgres_inspection.stdout | from_json | first).HostConfig.NanoCpus == (
              ((postgres_inspection.item.resources.cpus | float) * 1000000000) | int
              if postgres_inspection.item.resources.cpus | default('') | string | length > 0 else 0
            )
          )
        }]
      }}
  no_log: true
