---
- name: Wait for Docker PostgreSQL health checks
  ansible.builtin.command:
    argv:
      - docker
      - container
      - inspect
      - --format
      - "{% raw %}{{.State.Health.Status}}{% endraw %}"
      - "{{ item.container_name }}"
  register: infrastructure_services_postgres_health
  changed_when: false
  retries: 20
  delay: 3
  until: infrastructure_services_postgres_health.stdout == 'healthy'
  loop: "{{ infrastructure_services_postgres_instances }}"
  no_log: true

- name: Prove PostgreSQL responds with pg_isready
  ansible.builtin.command:
    argv:
      - docker
      - container
      - exec
      - "{{ item.container_name }}"
      - pg_isready
      - --username
      - "{{ item.user }}"
      - --dbname
      - "{{ item.database }}"
  register: infrastructure_services_postgres_pg_isready
  changed_when: false
  failed_when: infrastructure_services_postgres_pg_isready.rc != 0
  loop: "{{ infrastructure_services_postgres_instances }}"
  no_log: true

- name: Inspect final PostgreSQL runtime contracts
  ansible.builtin.command:
    argv: [docker, container, inspect, "{{ item.container_name }}"]
  register: infrastructure_services_postgres_final_inspections
  changed_when: false
  loop: "{{ infrastructure_services_postgres_instances }}"
  no_log: true

- name: Validate PostgreSQL ownership, persistence, and private attachment
  ansible.builtin.assert:
    that:
      - (item.stdout | from_json | first).State.Running
      - (item.stdout | from_json | first).State.Health.Status == 'healthy'
      - (item.stdout | from_json | first).Config.Image == item.item.image
      - (item.stdout | from_json | first).HostConfig.RestartPolicy.Name == 'unless-stopped'
      - (item.stdout | from_json | first).HostConfig.PortBindings | default({}, true) | length == 0
      - (item.stdout | from_json | first).NetworkSettings.Networks.keys() | list == [item.item.network_name]
      - ((item.stdout | from_json | first).Config.Labels | default({}, true)).get('foundry.managed') == 'true'
      - ((item.stdout | from_json | first).Config.Labels | default({}, true)).get('foundry.project') == project.name
      - ((item.stdout | from_json | first).Config.Labels | default({}, true)).get('foundry.environment') == item.item.environment
      - ((item.stdout | from_json | first).Config.Labels | default({}, true)).get('foundry.service') == 'postgres'
      - ((item.stdout | from_json | first).Config.Labels | default({}, true)).get('foundry.resource') == 'postgres'
      - (item.stdout | from_json | first).Mounts | selectattr('Name', 'equalto', item.item.volume_name) | selectattr('Destination', 'equalto', '/var/lib/postgresql/data') | list | length == 1
    fail_msg: PostgreSQL failed its ownership, persistence, or network-isolation contract.
  loop: "{{ infrastructure_services_postgres_final_inspections.results }}"
  no_log: true
