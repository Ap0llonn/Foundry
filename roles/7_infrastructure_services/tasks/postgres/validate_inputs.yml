---
- name: Require the resolved PostgreSQL instance list
  ansible.builtin.assert:
    that:
      - infrastructure_services_postgres_instances is defined
      - infrastructure_services_postgres_instances is sequence
      - infrastructure_services_postgres_instances is not string
      - project is mapping
      - project.name | default('') is string
      - project.name | default('') | length > 0
    fail_msg: PostgreSQL requires a pre-resolved instance list and project.name.
  no_log: true

- name: Validate each resolved PostgreSQL instance contract
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.keys() | difference(['environment', 'network_name', 'container_name', 'volume_name', 'image', 'user', 'database', 'password', 'password_file', 'resources']) | length == 0
      - item.environment | default('') is match('^[a-z][a-z0-9-]{0,31}$')
      - item.network_name | default('') is match('^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$')
      - item.container_name | default('') == 'foundry-' + project.name + '-' + item.environment + '-postgres'
      - item.volume_name | default('') == 'foundry-' + project.name + '-' + item.environment + '-postgres-data'
      - item.image | default('') is match('^.+@sha256:[a-f0-9]{64}$')
      - item.user | default('') is match('^[A-Za-z_][A-Za-z0-9_-]{0,62}$')
      - item.database | default('') is match('^[A-Za-z_][A-Za-z0-9_-]{0,62}$')
      - item.password | default('') is string
      - item.password | default('') | length >= 16
      - item.password_file | default('') is match('^/var/lib/foundry/infrastructure-services/secrets/[A-Za-z0-9._/-]+/password$')
      - item.resources | default({}) is mapping
      - (item.resources | default({})).keys() | difference(['memory', 'cpus']) | length == 0
      - item.resources.memory | default('') | string is match('^$|^[1-9][0-9]*[bkmgBKMG]?$')
      - item.resources.cpus | default('') | string is match('^$|^[0-9]+([.][0-9]+)?$')
      - item.resources.cpus | default(1, true) | float > 0
    fail_msg: A resolved PostgreSQL instance violates naming, image, secret, or resource policy.
  loop: "{{ infrastructure_services_postgres_instances }}"
  no_log: true

- name: Require unique PostgreSQL environments and resource names
  ansible.builtin.assert:
    that:
      - infrastructure_services_postgres_instances | map(attribute='environment') | unique | length == infrastructure_services_postgres_instances | length
      - infrastructure_services_postgres_instances | map(attribute='container_name') | unique | length == infrastructure_services_postgres_instances | length
      - infrastructure_services_postgres_instances | map(attribute='volume_name') | unique | length == infrastructure_services_postgres_instances | length
      - infrastructure_services_postgres_instances | map(attribute='password') | unique | length == infrastructure_services_postgres_instances | length
    fail_msg: PostgreSQL environments, names, volumes, and credentials must be unique.
  no_log: true

- name: Verify Docker runtime for PostgreSQL
  ansible.builtin.command:
    argv: [docker, info]
  register: infrastructure_services_postgres_docker_info
  changed_when: false
  failed_when: false
  check_mode: false

- name: Require the role-6 Docker runtime
  ansible.builtin.assert:
    that:
      - infrastructure_services_postgres_docker_info.rc == 0
    fail_msg: Docker is unavailable; run Runtime and Networking before PostgreSQL.
