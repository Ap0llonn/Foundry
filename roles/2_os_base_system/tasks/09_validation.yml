---
- name: Gather installed package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Build expected package list
  ansible.builtin.set_fact:
    os_base_expected_packages: >-
      {{
        os_base_packages
        + os_base_package_control_packages
        + ['locales', os_base_time_package]
        + ([os_base_dns_package] if os_base_dns_tools_required | default(true) | bool else [])
      }}

- name: Validate required packages
  ansible.builtin.assert:
    that:
      - os_base_expected_packages | difference(ansible_facts.packages.keys() | list) | length == 0
    fail_msg: >-
      Missing required packages:
      {{ os_base_expected_packages | difference(ansible_facts.packages.keys() | list) | join(', ') }}.
    success_msg: "All required OS baseline packages are installed."

- name: Validate effective host identity
  ansible.builtin.include_tasks: validate_host_identity.yml

- name: Resolve configured FQDN IPv4 records through DNS
  ansible.builtin.command:
    argv: [dig, +short, A, "{{ os_base_fqdn }}"]
  register: os_base_fqdn_ipv4_resolution
  changed_when: false
  check_mode: false
  when: os_base_hostname_validate_dns | bool

- name: Resolve configured FQDN IPv6 records through DNS
  ansible.builtin.command:
    argv: [dig, +short, AAAA, "{{ os_base_fqdn }}"]
  register: os_base_fqdn_ipv6_resolution
  changed_when: false
  check_mode: false
  when: os_base_hostname_validate_dns | bool

- name: Build explicit DNS address result
  ansible.builtin.set_fact:
    os_base_fqdn_dns_addresses: >-
      {{
        (
          os_base_fqdn_ipv4_resolution.stdout_lines
          + os_base_fqdn_ipv6_resolution.stdout_lines
        )
        | ansible.utils.ipaddr
        | unique
        | list
      }}
  when: os_base_hostname_validate_dns | bool

- name: Validate configured FQDN addresses
  ansible.builtin.assert:
    that:
      - os_base_fqdn_dns_addresses | length > 0
      - >-
        os_base_hostname_expected_addresses | length == 0
        or os_base_hostname_expected_addresses
           | difference(os_base_fqdn_dns_addresses)
           | length == 0
    fail_msg: "FQDN does not resolve to all expected addresses."
  when: os_base_hostname_validate_dns | bool

- name: Validate reverse DNS for expected addresses
  ansible.builtin.command:
    argv: [dig, +short, -x, "{{ item }}"]
  loop: "{{ os_base_hostname_expected_addresses }}"
  loop_control:
    label: "{{ item }}"
  register: os_base_reverse_dns_checks
  changed_when: false
  check_mode: false
  when:
    - os_base_hostname_validate_dns | bool
    - os_base_hostname_validate_reverse_dns | bool

- name: Require reverse DNS to contain configured FQDN
  ansible.builtin.assert:
    that:
      - >-
        (os_base_fqdn | lower | regex_replace('\.$', ''))
        in (
          item.stdout_lines
          | map('lower')
          | map('regex_replace', '\\.$', '')
          | list
        )
    fail_msg: "Reverse DNS for {{ item.item }} does not contain {{ os_base_fqdn }}."
  loop: "{{ os_base_reverse_dns_checks.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"

- name: Inspect required system directories
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: "{{ os_base_directories }}"
  loop_control:
    label: "{{ item.path }}"
  register: os_base_directory_checks

- name: Validate required system directories
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isdir
      - item.stat.pw_name == (item.item.owner | default('root'))
      - item.stat.gr_name == (item.item.group | default('root'))
      - item.stat.mode == (item.item.mode | default('0755'))
    fail_msg: "Invalid directory baseline: {{ item.item.path }}."
  loop: "{{ os_base_directory_checks.results }}"
  loop_control:
    label: "{{ item.item.path }}"

- name: Validate global fstab
  ansible.builtin.include_tasks: validate_fstab.yml

- name: Validate live mounts and persistent fstab declarations
  ansible.builtin.include_tasks: validate_mount.yml
  loop: "{{ os_base_mounts }}"
  loop_control:
    loop_var: os_base_mount
    label: "{{ os_base_mount.path }}"

- name: Build capacity validation paths
  ansible.builtin.set_fact:
    os_base_effective_capacity_paths: >-
      {{
        os_base_capacity_paths
        + (
          os_base_mounts
          | selectattr('state', 'undefined')
          | list
        )
        + (
          os_base_mounts
          | selectattr('state', 'defined')
          | selectattr('state', 'equalto', 'mounted')
          | list
        )
      }}

- name: Validate filesystem capacity and inode policy
  ansible.builtin.include_tasks: validate_capacity.yml
  loop: "{{ os_base_effective_capacity_paths }}"
  loop_control:
    loop_var: os_base_capacity
    label: "{{ os_base_capacity.path }}"

- name: Validate swap policy
  ansible.builtin.include_tasks: validate_swap.yml

- name: Validate synchronized and authenticated time source
  ansible.builtin.include_tasks: validate_time.yml

- name: Read generated locale inventory
  ansible.builtin.command:
    argv: [locale, -a]
  register: os_base_locale_inventory
  changed_when: false
  check_mode: false

- name: Read localectl locale policy
  ansible.builtin.command:
    argv: [localectl, status, --no-pager]
  register: os_base_localectl_check
  changed_when: false
  check_mode: false

- name: Validate locale in a fresh login session
  become: true
  ansible.builtin.command:
    argv: [su, --login, root, --command, locale]
  register: os_base_login_locale_check
  changed_when: false
  check_mode: false

- name: Validate generated and fresh-session locale policy
  ansible.builtin.assert:
    that:
      - >-
        (os_base_locale | lower | replace('-', ''))
        in (os_base_locale_inventory.stdout | lower | replace('-', ''))
      - "('LANG=' + os_base_locale) in os_base_localectl_check.stdout"
      - "('LANG=' + os_base_locale) in os_base_login_locale_check.stdout_lines"
      - "'LC_ALL=' in os_base_login_locale_check.stdout_lines"
      - "('LC_ALL=' + os_base_locale) not in os_base_login_locale_check.stdout_lines"
    fail_msg: "Locale is not generated or fresh sessions do not inherit LANG safely."

- name: Validate every configured locale category
  ansible.builtin.assert:
    that:
      - (item.key + '=' + item.value) in os_base_localectl_check.stdout
      - (item.key + '=' + item.value) in os_base_login_locale_check.stdout_lines
    fail_msg: >-
      Configured locale category {{ item.key }} is missing from localectl or a fresh login.
  loop: "{{ os_base_locale_categories | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Validate normalized system services
  ansible.builtin.include_tasks: validate_service.yml
  loop: "{{ os_base_effective_services }}"
  loop_control:
    loop_var: os_base_service
    label: "{{ os_base_service.name }}"

- name: Inspect conflicting time providers after convergence
  ansible.builtin.command:
    argv: [systemctl, show, "{{ item }}.service", --property=LoadState, --property=ActiveState, --property=UnitFileState]
  loop: "{{ os_base_time_conflicting_services }}"
  loop_control:
    label: "{{ item }}"
  register: os_base_time_conflict_validation
  changed_when: false
  failed_when: false
  check_mode: false

- name: Validate conflicting time providers are absent or masked
  ansible.builtin.assert:
    that:
      - >-
        item.rc != 0
        or 'LoadState=not-found' in item.stdout
        or (
          'ActiveState=inactive' in item.stdout
          and (
            'UnitFileState=masked' in item.stdout
            or 'UnitFileState=masked-runtime' in item.stdout
          )
        )
    fail_msg: "Conflicting time provider remains usable: {{ item.item }}."
  loop: "{{ os_base_time_conflict_validation.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Check whether a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: os_base_reboot_required_file

- name: Expose reboot requirement without authorizing reboot
  ansible.builtin.set_fact:
    os_base_reboot_required: "{{ os_base_reboot_required_file.stat.exists }}"

- name: Report OS baseline validation result
  ansible.builtin.debug:
    msg:
      - "OS baseline validation: OK"
      - "Operation mode: {{ os_base_operation_mode }}"
      - "Clock synchronized within {{ os_base_time_max_offset_seconds }} seconds: yes"
      - "Reboot required: {{ os_base_reboot_required | ternary('yes', 'no') }}"
      - >-
        Reboot executed by this role: no. Use tasks/10_controlled_reboot.yml
        in an explicitly approved final playbook phase.
