---
- name: Validate complete fstab syntax and resolvability
  ansible.builtin.command:
    argv: [findmnt, --verify, --verbose]
  register: os_base_global_fstab_validation
  changed_when: false
  check_mode: false

- name: Require globally valid fstab
  ansible.builtin.assert:
    that:
      - os_base_global_fstab_validation.rc == 0
    fail_msg: >-
      Global fstab validation failed: {{ os_base_global_fstab_validation.stderr }}
