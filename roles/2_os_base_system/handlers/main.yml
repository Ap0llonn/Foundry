---
- name: Generate configured locales
  become: true
  ansible.builtin.command:
    argv: [locale-gen]
  changed_when: true

- name: Validate installed Chrony configuration
  become: true
  ansible.builtin.command:
    argv: [chronyd, -p, -f, /etc/chrony/chrony.conf]
  changed_when: false
  listen: Restart Chrony

- name: Restart Chrony after successful validation
  become: true
  ansible.builtin.systemd_service:
    name: "{{ os_base_time_service }}.service"
    state: restarted
  listen: Restart Chrony
