---
# The global `identity` configuration is the source of truth. The raw user list
# may contain password hashes, so downstream tasks use a normalized, secret-free
# list built during validation.
identity_access_users_config: "{{ (identity | default({})).get('users', []) }}"
identity_access_group_definitions_config: >-
  {{ (identity | default({})).get('groups', []) }}
identity_access_default_admin_sudo: >-
  {{ (identity | default({})).get('default_admin_sudo', {}) }}

identity_access_default_home_root: /home
identity_access_default_shell: /bin/bash
identity_access_sudo_package: sudo
identity_access_sudo_binary: /usr/bin/sudo
identity_access_visudo_binary: /usr/sbin/visudo
identity_access_passwd_binary: /usr/bin/passwd
identity_access_gpasswd_binary: /usr/bin/gpasswd
identity_access_sudoers_directory: /etc/sudoers.d
identity_access_sudoers_prefix: foundry-

# Foundry owns only Linux groups in the `foundry-*` namespace. The effective
# map is built during validation after applying configured replacements.
identity_access_group_prefix: foundry-
identity_access_owned_group_pattern: '^foundry-'
identity_access_default_group_map:
  developer: foundry-developer
  operator: foundry-operator
  viewer: foundry-viewer

# `replaces` accepts singular or plural names for the built-in logical roles.
identity_access_default_group_aliases:
  developer: developer
  developers: developer
  operator: operator
  operators: operator
  viewer: viewer
  viewers: viewer

identity_access_allowed_group_definition_properties:
  - name
  - replaces

# The logical name is limited so `foundry-<name>` remains a valid Linux group.
identity_access_group_name_pattern: '^[a-z_][a-z0-9_-]{0,23}$'

# These groups carry privileges outside Foundry's authorization policy and may
# not be requested through identity.users[].groups.
identity_access_privileged_groups:
  - adm
  - docker
  - lxd
  - root
  - sudo
  - wheel

# System identities must never be managed as human Foundry accounts.
identity_access_protected_accounts:
  - daemon
  - halt
  - nobody
  - root
  - shutdown
  - sync

identity_access_allowed_states:
  - present
  - absent

identity_access_allowed_user_properties:
  - name
  - state
  - admin
  - groups
  - ssh_keys
  - sudo

identity_access_allowed_sudo_properties:
  - mode
  - authentication
  - commands
  - password_hash

identity_access_allowed_default_sudo_properties:
  - mode
  - authentication
  - commands

identity_access_allowed_sudo_modes:
  - inherit
  - passwordless
  - password
  - constrained
  - none

identity_access_allowed_default_sudo_modes:
  - passwordless
  - password
  - constrained

identity_access_allowed_constrained_authentication:
  - passwordless
  - password

# Accept modern crypt-format hashes, not plaintext passwords or locked markers.
# The value should normally come from Ansible Vault or an external secret source.
identity_access_password_hash_pattern: '^(\$2[aby]\$[0-9]{2}\$[./A-Za-z0-9]{53}|\$5\$(rounds=[0-9]+\$)?[^$:\s]{1,16}\$[./A-Za-z0-9]{43}|\$6\$(rounds=[0-9]+\$)?[^$:\s]{1,16}\$[./A-Za-z0-9]{86}|\$y\$[./A-Za-z0-9]+\$[^$:\s]+\$[./A-Za-z0-9]+)$'
identity_access_sudo_command_pattern: '^/[^,\r\n\\]+$'

identity_access_ssh_public_key_pattern: '^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521)|sk-ssh-ed25519@openssh\.com|sk-ecdsa-sha2-nistp256@openssh\.com)\s+[A-Za-z0-9+/]+={0,3}(\s+.*)?$'
