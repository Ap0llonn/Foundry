---
- name: Ensure sudo tooling is installed
  ansible.builtin.package:
    name: "{{ identity_access_sudo_package }}"
    state: present

- name: Ensure managed sudoers directory exists
  ansible.builtin.file:
    path: "{{ identity_access_sudoers_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Find Foundry-managed sudoers policies
  ansible.builtin.find:
    paths: "{{ identity_access_sudoers_directory }}"
    patterns: "{{ identity_access_sudoers_prefix }}*"
    file_type: any
    recurse: false
  register: identity_access_managed_sudoers_files

- name: Remove obsolete or unsafe Foundry-managed sudoers paths
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  when: >-
    not (item.isreg | default(false))
    or (
      item.path | basename
      not in (
        identity_access_users
        | selectattr('state', 'equalto', 'present')
        | selectattr('admin', 'equalto', true)
        | map(attribute='sudoers_filename')
        | list
      )
    )
  loop: "{{ identity_access_managed_sudoers_files.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Install explicit per-user administrative sudo policies
  ansible.builtin.template:
    src: foundry-user-sudoers.j2
    dest: "{{ identity_access_sudoers_directory }}/{{ item.sudoers_filename }}"
    owner: root
    group: root
    mode: "0440"
    validate: "{{ identity_access_visudo_binary }} -cf %s"
  when:
    - item.state == 'present'
    - item.admin
  loop: "{{ identity_access_users }}"
  loop_control:
    label: "{{ item.name }} -> {{ item.sudo_mode }}"

- name: Validate aggregate sudo configuration after reconciliation
  ansible.builtin.command:
    argv:
      - "{{ identity_access_visudo_binary }}"
      - -cf
      - /etc/sudoers
  changed_when: false

- name: Read memberships before Foundry-owned group reconciliation
  ansible.builtin.command:
    argv:
      - id
      - -nG
      - "{{ item.name }}"
  changed_when: false
  check_mode: false
  when: item.state == 'present'
  loop: "{{ identity_access_users }}"
  loop_control:
    label: "{{ item.name }}"
  register: identity_access_group_memberships_before

- name: Initialize unrelated group preservation snapshot
  ansible.builtin.set_fact:
    identity_access_unmanaged_groups_before: {}

- name: Record unrelated supplementary groups before reconciliation
  ansible.builtin.set_fact:
    identity_access_unmanaged_groups_before: >-
      {{
        identity_access_unmanaged_groups_before
        | combine(
          {
            item.item.name: (
              item.stdout.split()
              | reject('match', identity_access_owned_group_pattern)
              | difference([item.item.name])
              | unique
              | sort
            )
          }
        )
      }}
  when: not item.skipped | default(false)
  loop: "{{ identity_access_group_memberships_before.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Reconcile only Foundry-owned group memberships
  ansible.builtin.include_tasks: reconcile_user_groups.yml
  when: not identity_access_membership.skipped | default(false)
  loop: "{{ identity_access_group_memberships_before.results }}"
  loop_control:
    loop_var: identity_access_membership
    label: "{{ identity_access_membership.item.name }}"

- name: Gather groups after membership reconciliation
  ansible.builtin.getent:
    database: group

- name: Remove obsolete Foundry-owned Linux groups
  ansible.builtin.group:
    name: "{{ item }}"
    state: absent
    force: false
  loop: >-
    {{
      ansible_facts.getent_group.keys()
      | select('match', identity_access_owned_group_pattern)
      | difference(identity_access_group_map.values() | list)
      | sort
    }}
  loop_control:
    label: "{{ item }}"
