---
- name: Create or update present human users
  ansible.builtin.user:
    name: "{{ item.name }}"
    state: present
    group: "{{ item.name }}"
    home: "{{ identity_access_default_home_root }}/{{ item.name }}"
    shell: "{{ identity_access_default_shell }}"
    create_home: true
  when: (item.state | default('present')) == 'present'
  loop: "{{ identity_access_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Set Linux account passwords required by sudo policy
  ansible.builtin.user:
    name: "{{ item.name }}"
    password: "{{ identity_access_password_hashes[item.name] }}"
    update_password: always
  when:
    - item.state == 'present'
    - item.sudo_password_required
  loop: "{{ identity_access_users }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Remove explicitly absent human users while preserving their data
  ansible.builtin.user:
    name: "{{ item.name }}"
    state: absent
    remove: false
    force: false
  when: (item.state | default('present')) == 'absent'
  loop: "{{ identity_access_users }}"
  loop_control:
    label: "{{ item.name }}"
