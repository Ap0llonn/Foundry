  exposure:
    - {name: traefik-http, port: 80, protocol: tcp, scope: public}
    - {name: dokploy-management, port: 3000, protocol: tcp, scope: management}
expected_resolved_domains:
  dev:
    api: ""
expected_dokploy_endpoint: http://192.0.2.25:3000

