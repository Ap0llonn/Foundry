---
- name: Validate networking fixture without Docker access
  hosts: localhost
  gather_facts: false
  connection: local
  tasks:
    - name: Load fixture
      ansible.builtin.include_vars:
        file: "{{ fixture_file }}"

    - name: Run networking validation only
      ansible.builtin.include_role:
        name: 5_networking
        tasks_from: 01_validate
