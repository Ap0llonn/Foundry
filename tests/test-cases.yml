---
# Machine-readable acceptance catalog. `automated: false` is an explicit gap,
# never an implicit pass.
test_cases:
  - id: TC-GLOBAL-001
    criterion: AC-GLOBAL-001
    title: Pinned controller verification
    tier: static
    automated: true
    destructive: false
    expected: Exact locked controller dependencies are installed.

  - id: TC-GLOBAL-002
    criterion: AC-GLOBAL-002
    title: Main and detached role syntax
    tier: static
    automated: true
    destructive: false
    expected: Main playbook, OS helpers, and identity helpers parse successfully.

  - id: TC-GLOBAL-003
    criterion: AC-GLOBAL-003
    title: Acceptance catalog consistency and safety classification
    tier: static
    automated: true
    destructive: false
    expected: IDs are unique, criteria exist, fixtures exist, and mutation tiers are explicit.

