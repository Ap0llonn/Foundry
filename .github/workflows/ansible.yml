---
name: Ansible controller validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  controller:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          pip-version: "26.2.1"
          cache: pip
          cache-dependency-path: requirements-controller.lock

      - name: Install pinned controller packages
        run: python -m pip install --requirement requirements-controller.lock

      - name: Validate Python dependency compatibility
        run: python -m pip check

      - name: Install pinned Ansible collections
        run: >-
          ansible-galaxy collection install
          --requirements-file collections/requirements.yml
          --collections-path collections
          --no-deps
          --force

      - name: Verify versions and playbook syntax
        run: python scripts/verify-controller.py
